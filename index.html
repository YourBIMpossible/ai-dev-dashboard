// ── Check-in triage contract ────────────────────────────────────────────────
// The desk splits into RIPE ("Needs you" — an owner decision/approval/ratification/choice or
// an owner-resolvable blocker) and PARKED (waiting on CI/upstream/vendor/dependency; dormant /
// future / placeholder / conditional / gated; reminders and context; already done/closed). The
// split only PARTITIONS a list shown in full — parked items fold, they are never dropped — so a
// misread changes ordering, never visibility. It fails safe: anything the cues do not recognise
// stays RIPE, never silently hidden. Cues come from the real desk strings already in data.js.
//
// (1) Gated / dormant / soft-non-gating / placeholder / conditional prerequisites → parked.
const DESK_PARK=/\b(dormant|non-?gating|blocks nothing|no demand|gated on|deferred|on hold|direction-only|single-operator|placeholder|conditional on|before (?:building|deciding|you)\b|re-?check\b|until\b[^.]*\b(?:fires?|lands?|ships?|exists?)\b|no (?:trigger|demand)|soft,?\s*non|not built[;,]|none (?:has|yet))/i;
// (2) "awaiting / waiting on / blocked on / depends on X" parks ONLY when X is not the owner.
// "awaiting owner ratification / your sign-off / needs your decision" is the ripest state there
// is — it is waiting on YOU — so the owner-cue lookahead keeps it in the queue.
const DESK_WAIT=/\b(?:await(?:s|ing)?|waiting (?:on|for)|blocked (?:on|by)|depend(?:s|ent)? on)\b(?![^.]*\b(?:owner|your\b|you\b|ratif|sign-?off|approv|decision|decide|choice|call)\b)/i;
// (3) Already resolved — no owner action remains. Terminal-completion wording only, so an OPEN
// owner choice like "merge or close" / "ship it or delete it" is NOT caught (those stay ripe).
const DESK_DONE=/\b(?:no (?:action|owner action|decision|call|approval)\s*(?:needed|required)|already (?:done|merged|closed|shipped|resolved|handled)|nothing (?:to do|needed|left)|complete[d]?[.;]|closed[.;]|resolved[.;])/i;
function deskRipe(d){ const t=String(d.text||''); return !DESK_PARK.test(t)&&!DESK_WAIT.test(t)&&!DESK_DONE.test(t); }
// The whole contract in one pure function: reminders are context (park by kind); blockers and
// decisions are ripe only when their text is not parked. Every eligible item lands in exactly
// one bucket, so folded `parked` + visible `ripe` always reconcile to the whole desk — nothing
// is dropped between them. Shared by todayView and the behavioural tests so both see one contract.
function tvPartition(desk){
  const isRipe=d=>(d.kind==='blocker'||d.kind==='decision')&&deskRipe(d);
  return {ripe:desk.filter(isRipe), parked:desk.filter(d=>!isRipe(d))};
}

// Feed / desk copy is ledger prose carrying (#123) PR-and-issue citations. Dim those refs so the
// sentence reads first and the trail-back citation sits quietly after it — kept, never deleted.
function tvHumanize(t){
  return esc(String(t||'')).replace(/\(?#\d+(?:[,/]\s*#?\d+)*\)?/g,m=>`<span class="tv-ref">${m}</span>`);
}

// The flagship's two honest numbers, for the top of the check-in. Delivery cohort = the frozen
// July scope (membership fixed, so scope growth cannot move it); active scope = weighted mean of
// every active ratified phase, which reads lower mainly because newer early-stage phases were
// admitted, not because anything regressed. Falls back to one number if no cohort is declared.
function flagshipMetric(){
  const bp=D.projects.find(p=>p.id==='bimpossible');
  if(!bp)return'';
  const pct=overallPct(bp);
  if(pct===null)return'';
  const co=cohortResults(bp), first=co.length?co[0]:null;
  const coPct=(first&&first.r&&first.r.pct!=null)?first.r.pct:null;
  const nums=coPct!=null
    ? `<span class="fm-n">${coPct}%</span><span class="fm-l">delivery cohort</span><span class="fm-sep"></span><span class="fm-n dim">${pct}%</span><span class="fm-l">active scope</span>`
    : `<span class="fm-n">${pct}%</span><span class="fm-l">active scope</span>`;
  const tip=coPct!=null
    ? 'Delivery cohort = the frozen July scope; its membership is fixed, so scope growth cannot move it. Active scope = mean of every active ratified phase and can read lower purely because newer early-stage phases were admitted — not because work regressed.'
    : 'Mean completion across active ratified phases.';
  return `<button type="button" class="tv-fm" title="${esc(tip)}" onclick="show('bimpossible')">`
    +`<span class="fm-hd">${esc(bp.name)}</span>${nums}<span class="fm-go">open →</span></button>`;
}
function spark(series){
  const s=(series||[]).slice(-14);
  if(!s.length)return'';
  const max=Math.max(...s,1);
  return'<span class="tv-spark" aria-hidden="true">'+
    s.map(v=>`<i class="${v?'':'z'}" style="height:${v?Math.max(12,Math.round(v/max*100)):6}%"></i>`).join('')+
    '</span>';
}
function todayView(){
  const feed=tvFeed(), desk=tvDesk();
  const commits14=p=>(p.activity||[]).reduce((a,b)=>a+b,0);
  const auHot=D.projects.reduce((s,p)=>{const a=auditSummary(p);return s+(a?a.hot:0);},0);
  const dataAge=daysAgo(D.generated), stale=dataAge>=FRESH.live;

  let h=`<div class="tv-head"><div><div class="crumbs">Today</div>`
    +`<h2 class="page">Check-in</h2></div>`
    +`<span class="when">${dayLabel(isoDate(TODAY))} · data ${relDay(D.generated)}</span></div>`;

  // Flagship earned-value line — two honest numbers, not the diluted flat average.
  h+=flagshipMetric();

  // ── 1. Needs you — the clearable triage queue ───────────────────────────
  // The old surface dumped every blocker/decision/reminder under one "On your desk" heading
  // (47 rows). Here the top band is only what genuinely needs a decision today; everything
  // parked or waiting on a trigger folds away (never dropped), so an empty band honestly means
  // "you're clear to build", not "we hid the rest". Reminders are context, so they park too.
  const {ripe,parked}=tvPartition(desk);
  const item=d=>`<button type="button" class="tv-item" onclick="show('${esc(d.pid)}')">`
    +`<span class="tv-kind k-${d.kind}">${d.kind}</span>`
    +`<span class="body"><span class="who">${esc(d.pname)}</span><p>${tvHumanize(d.text)}</p></span></button>`;
  h+=`<section class="tv-sec" id="tv-desk"><h3>Needs you <span class="ct">· ${ripe.length||'clear'}</span></h3>`;
  if(auHot||stale){
    h+=`<div class="tv-alert">`;
    if(auHot)h+=`<button type="button" class="tv-chip danger" onclick="show('audit')">${ICO.shield}<span class="n">${auHot}</span> urgent audit</button>`;
    if(stale)h+=`<button type="button" class="tv-chip warn" onclick="doReload(this)">${ICO.refresh}Data ${dataAge}d old — refresh</button>`;
    h+=`</div>`;
  }
  if(ripe.length)h+=`<div class="tv-desk">`+ripe.map(item).join('')+`</div>`;
  else h+=`<div class="tv-clear">${ICO.check}<div><b>Nothing needs a decision today.</b><span>No ripe blockers or decisions — clear to build.</span></div></div>`;
  if(parked.length)h+=revealBlock(`<div class="tv-desk tv-parked">`+parked.map(item).join('')+`</div>`,parked.length,'parked item');
  h+=`</section>`;

  // ── 2. Since your last check-in ─────────────────────────────────────────
  // With no stored previous visit, show a 7-day window rather than an empty band.
  const cutoff=_sinceDate||isoDate(new Date(TODAY.getTime()-7*86400000));
  const fresh=feed.filter(e=>e.date>cutoff);
  const shown=fresh.length?fresh:feed.slice(0,8);
  const heading=_sinceDate
    ? `Since your last check-in <span class="ct">· ${dayLabel(_sinceDate)}</span>`
    : `Recent activity <span class="ct">· last 7 days</span>`;
  // When nothing is new the band still shows the last 8 entries as context — so the heading has
  // to say that outright, or "nothing new" reads as a contradiction of the list under it.
  const caught=`Nothing new since ${_sinceDate?dayLabel(_sinceDate):'your last visit'} <span class="ct">· last ${Math.min(8,feed.length)} updates for context</span>`;
  h+=`<section class="tv-sec"><h3>${fresh.length?heading:caught}</h3>`;
  if(!shown.length){
    h+=`<div class="tv-empty">No dated activity recorded yet.</div>`;
  }else{
    const days=[...new Set(shown.map(e=>e.date))];
    days.forEach(d=>{
      h+=`<div class="tv-day"><div class="tv-date">${dayLabel(d)}<span class="rel">${relDay(d)}</span></div><div class="tv-feed">`;
      shown.filter(e=>e.date===d).forEach(e=>{
        h+=`<button type="button" class="tv-ev${e.date>cutoff&&_sinceDate?' new':''}" onclick="show('${esc(e.pid)}')">`
          +`<span class="proj">${esc(e.pname.replace(/^BIMpossible\s*/,'')||e.pname)}</span>`
          +`<span class="txt">${tvHumanize(e.text)}</span></button>`;
      });
      h+=`</div></div>`;
    });
  }
  h+=`</section>`;

  // ── 3. Movement ─────────────────────────────────────────────────────────
  const ranked=D.projects.slice().sort((a,b)=>commits14(b)-commits14(a));
  const moving=ranked.filter(p=>commits14(p)>0);
  const quiet=ranked.filter(p=>commits14(p)===0);
  // The per-row percent is a QUICK unweighted phase average, not an authoritative completion
  // figure — the two-number headline at the top owns that. Label it plainly ("current phase
  // average") and never as overall/progress, so a glance here can't be mistaken for the earned
  // value. Ordering is by 14-day commits (movement), deliberately not by this percent.
  h+=`<section class="tv-sec"><h3>Movement <span class="ct">· 14 days</span></h3>`
    +`<div class="tv-move-cap">Percent = current phase average — a quick unweighted signal. The completion headline up top is the authority for active scope &amp; delivery cohort.</div>`
    +`<div class="tv-move">`;
  moving.forEach(p=>{
    const pc=overallPct(p), c=commits14(p);

      +`<span class="nm">${esc(p.name)}<small>${esc((p.lastActivity&&p.lastActivity.summary)||p.oneLiner||'')}</small></span>`
      +spark(p.activity)
      +`<span class="commits">${c}<em> c</em></span>`
      +`<span class="pctv" title="Current phase average — a quick unweighted phase signal; use the completion headline above for active scope and delivery-cohort status.">${pc!==null?pc+'%':'—'}</span></button>`;
  });
  if(quiet.length){
    h+=`<div class="tv-quiet"><span class="lbl">Quiet</span>`
      +quiet.map(p=>`<button type="button" onclick="show('${esc(p.id)}')">${esc(p.name)}</button>`).join('')
      +`<span>· no commits in 14 days</span></div>`;
  }
  h+=`</div></section>`;
  return h;
}

  D.projects.forEach(p=>(p.progress&&p.progress.phases||[]).forEach(f=>
    rows.push({t:f.name,k:p.name,ico:ICO.layers,go:()=>show(p.id)})));
  tvFeed().slice(0,40).forEach(e=>rows.push({t:e.text,k:e.date,ico:ICO.check,go:()=>show(e.pid)}));
  return rows;
}
function openCP(){
  if(document.querySelector('.cp-bg'))return;
  const bg=document.createElement('div');
  bg.className='cp-bg';bg.setAttribute('role','dialog');bg.setAttribute('aria-modal','true');bg.setAttribute('aria-label','Search');
  bg.innerHTML=`<div class="cp"><input type="text" id="cp-q" placeholder="Search projects, views, phases, activity…" autocomplete="off" spellcheck="false" aria-controls="cp-list" aria-autocomplete="list">`
    +`<div class="cp-list" id="cp-list" role="listbox"></div>`
    +`<div class="cp-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div></div>`;
  bg.onclick=e=>{if(e.target===bg)closeCP();};
  document.body.appendChild(bg);
  const all=cpIndex(),q=document.getElementById('cp-q');
  const draw=()=>{
    const s=q.value.trim().toLowerCase();
    _cpRows=(s?all.filter(r=>r.t.toLowerCase().includes(s)||r.k.toLowerCase().includes(s)):all).slice(0,40);
    _cpIdx=0;paint();
  };
  const paint=()=>{
    const L=document.getElementById('cp-list');
    if(!_cpRows.length){L.innerHTML='<div class="cp-none">No matches.</div>';return;}
    L.innerHTML=_cpRows.map((r,i)=>`<button type="button" class="cp-it" role="option" aria-selected="${i===_cpIdx}" data-i="${i}">${r.ico||''}<span class="t">${esc(r.t)}</span><span class="k">${esc(r.k)}</span></button>`).join('');
    L.querySelectorAll('.cp-it').forEach(el=>{
      el.onmouseenter=()=>{_cpIdx=+el.dataset.i;paint();};
      el.onclick=()=>{const r=_cpRows[+el.dataset.i];closeCP();r.go();};
    });
    const sel=L.querySelector('[aria-selected="true"]');
    if(sel)sel.scrollIntoView({block:'nearest'});
  };
  q.oninput=draw;
  q.onkeydown=e=>{
    if(e.key==='ArrowDown'){e.preventDefault();_cpIdx=Math.min(_cpIdx+1,_cpRows.length-1);paint();}
    else if(e.key==='ArrowUp'){e.preventDefault();_cpIdx=Math.max(_cpIdx-1,0);paint();}
    else if(e.key==='Enter'){e.preventDefault();const r=_cpRows[_cpIdx];if(r){closeCP();r.go();}}
  };
  _cpEsc=e=>{if(e.key==='Escape'){e.preventDefault();closeCP();}};
  document.addEventListener('keydown',_cpEsc);
  draw();q.focus();
}
function closeCP(){
  const bg=document.querySelector('.cp-bg');if(bg)bg.remove();
  if(_cpEsc){document.removeEventListener('keydown',_cpEsc);_cpEsc=null;}
}

function show(id){
  closePP();
  try{localStorage.setItem('dash.tab',id);}catch(e){}
  document.querySelectorAll('.nav').forEach(el=>{
    const on=el.dataset.id===id;
    el.classList.toggle('active',on);
    if(on)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');
  });
  const m=document.getElementById('main');
  if(id==='today')m.innerHTML=todayView();
  else if(id==='overview')m.innerHTML=overview();
  else if(id==='audit')m.innerHTML=auditView();
  else if(id==='graph')m.innerHTML=codebaseView();
  else if(id==='roadmap')m.innerHTML=roadmapView();
  else if(id==='strategy')m.innerHTML=strategyView();
  else if(id==='usage')m.innerHTML=monitorView();
  else if(id==='toolkit')m.innerHTML=toolkitView();
  else if(id==='bimwatch')m.innerHTML=(typeof bimwatchView==='function')?bimwatchView():'<div class="state-unavail">BIM-Watch panel failed to load</div>';
  else{const p=D.projects.find(q=>q.id===id);m.innerHTML=project(p);}
  m.querySelectorAll('[data-id]').forEach(el=>{if(!el.classList.contains('nav'))el.onclick=()=>show(el.dataset.id);});
  m.querySelectorAll('.ph-click').forEach(el=>{el.onclick=e=>{e.stopPropagation();openPP(el.dataset.pk,el);};});
  m.querySelectorAll('.au-jump[data-report-file]').forEach(el=>{
    const go=e=>{e.stopPropagation();auViewReport(el.dataset.reportFile,el.dataset.reportTitle||el.dataset.reportFile);};
    el.onclick=go;
    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(e);}};
  });
  m.querySelectorAll('.mtab[data-mt]').forEach(el=>{el.onclick=()=>{window._mtab=el.dataset.mt;try{localStorage.setItem('dash.mtab',el.dataset.mt);}catch(e){} show('usage');};});
  m.querySelectorAll('.mtab[data-ct]').forEach(el=>{el.onclick=()=>{window._ctab=el.dataset.ct;try{localStorage.setItem('dash.ctab',el.dataset.ct);}catch(e){} show('graph');};});
  balanceProjectGrid();
  animate();
}

// ══ Keyboard ════════════════════════════════════════════════════════════════
// Ctrl/Cmd-K opens search; `g` then a letter jumps; `?` shows the sheet.
let _gPending=false,_gTimer=null;
const GOTO={t:'today',o:'overview',a:'audit',c:'graph',r:'roadmap',s:'strategy',u:'usage',k:'toolkit',b:'bimwatch'};
function inField(e){
  const t=e.target;
  return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
}
document.addEventListener('keydown',e=>{
  // An open modal (command palette, shortcut sheet, report viewer) owns the keyboard: its own
  // listeners handle Escape and typing, and a g-jump must never swap the view underneath it.
  // No preventDefault here — the modal's handlers still see the event.
  if(document.querySelector('.cp-bg,.au-modal-bg')){_gPending=false;return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCP();return;}
  if(inField(e)||e.ctrlKey||e.metaKey||e.altKey)return;
  if(_gPending){
    clearTimeout(_gTimer);_gPending=false;
    const dest=GOTO[e.key.toLowerCase()];
    if(dest){e.preventDefault();show(dest);}
    return;
  }
  if(e.key==='g'){_gPending=true;_gTimer=setTimeout(()=>{_gPending=false;},1200);return;}
  if(e.key==='?'){e.preventDefault();openHelp();}
});
function openHelp(){
  if(document.querySelector('.cp-bg'))return;
  const rows=[['Ctrl/⌘ K','Search everything'],['g t','Today'],['g o','Overview'],['g a','Audit'],
    ['g c','Codebase'],['g r','Roadmap'],['g s','Strategy'],['g u','Usage'],['g k','Toolkit'],
    ['g b','BIM Watch'],['?','This sheet'],['esc','Close']];
  const bg=document.createElement('div');
  bg.className='cp-bg';bg.setAttribute('role','dialog');bg.setAttribute('aria-modal','true');bg.setAttribute('aria-label','Keyboard shortcuts');
  bg.innerHTML=`<div class="cp"><div class="cp-list" style="padding:14px">`
    +rows.map(([k,d])=>`<div class="cp-it" style="cursor:default"><span class="t">${esc(d)}</span><span class="k"><kbd>${esc(k)}</kbd></span></div>`).join('')
    +`</div></div>`;
  const close=()=>{bg.remove();document.removeEventListener('keydown',esk);};
  const esk=ev=>{if(ev.key==='Escape'){ev.preventDefault();close();}};
  bg.onclick=ev=>{if(ev.target===bg)close();};
  document.addEventListener('keydown',esk);
  document.body.appendChild(bg);
}

// ── Init ──────────────────────────────────────────────────────────────────
buildSide();
let init='today';
try{
  let s=localStorage.getItem('dash.tab');
  window._mtab=localStorage.getItem('dash.mtab')||'usage';
  const _savedCtab=localStorage.getItem('dash.ctab');
  window._ctab=(_savedCtab==='network'||_savedCtab==='dashboard'||_savedCtab==='report')?_savedCtab:null;
  if(s==='agents'||s==='health'){window._mtab=s;s='usage';}
  if(s&&(VIEWS.some(v=>v.id===s)||D.projects.some(p=>p.id===s)))init=s;
}catch(e){}
show(init);
