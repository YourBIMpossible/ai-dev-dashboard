<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-Dev Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080d;--panel:rgba(16,20,34,.82);--panel2:#131928;--panel3:#0f1422;
  --border:rgba(255,255,255,.065);--border-hi:rgba(110,140,255,.38);
  /* Grey ramp, lifted 2026-08-30. The originals (--dim #4d5870, --grey #5d6880) measured
     2.81:1 and 3.58:1 on --bg while carrying 100+ label strings at 10-11px.
     Ratios below are measured against the LIGHTEST surface each token actually renders on —
     rgb(27,34,56), a raised card — not against --bg, which flatters every value by ~1.2.
       --muted #98a3b8  6.20:1 on card / 7.88:1 on --bg
       --dim   #7d8aa4  4.53:1 on card / 5.76:1 on --bg
       --grey  #8491a8  4.95:1 on card / 6.29:1 on --bg  */
  --text:#e2e6f3;--muted:#98a3b8;--dim:#7d8aa4;
  --w:#6ea8ff;--w2:#a78bfa;--w3:#34d399;
  --p:#fb923c;--p2:#fbbf24;
  --green:#34d399;--amber:#fbbf24;--red:#f87171;--grey:#8491a8;
  --track:rgba(255,255,255,.055);--r:14px;
  /* type scale — 6 steps, nothing outside these */
  --ts-xs:10px;--ts-sm:12px;--ts-base:13.5px;--ts-md:16px;--ts-lg:21px;--ts-xl:24px;
  /* spacing rhythm — 4px base unit */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:36px;--sp-7:48px;
  /* status semantics — one system, five roles */
  --status-ok:#34d399;--status-warn:#fbbf24;--status-danger:#f87171;--status-info:#6ea8ff;--status-dim:#8491a8;
}
*{box-sizing:border-box;margin:0;padding:0;}
/* The UA sheet's `[hidden]{display:none}` is a bare attribute selector, so any class that sets its
   own display (.tk-grid is display:grid) silently wins and the "collapsed" block keeps its height.
   Every disclosure in here relies on the `hidden` property, so it gets the last word. */
[hidden]{display:none!important;}
html,body{height:100%;}
body{
  background:var(--bg);color:var(--text);
  font:var(--ts-base)/1.6 Inter,"Segoe UI",system-ui,sans-serif;
  background-image:
    radial-gradient(ellipse 1000px 600px at 8% -8%,rgba(70,110,255,.09),transparent 58%),
    radial-gradient(ellipse 700px 500px at 92% 12%,rgba(140,80,255,.06),transparent 55%),
    radial-gradient(ellipse 500px 400px at 50% 100%,rgba(251,146,60,.03),transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3,h4,.num{font-family:Sora,sans-serif;}
.num{font-variant-numeric:tabular-nums;}

/* ── Layout ────────────────────────────────── */
.app{display:flex;min-height:100vh;}

/* ── Sidebar ───────────────────────────────── */
aside{
  width:252px;flex-shrink:0;padding:18px 11px;
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;gap:1px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;}
.logo .mark{
  width:30px;height:30px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--w),var(--w2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 18px rgba(110,168,255,.32);
}
.logo .mark svg{width:15px;height:15px;stroke:#fff;stroke-width:2;fill:none;}
.logo h1{font-size:var(--ts-base);font-weight:700;line-height:1.15;}
.logo span{font-size:10px;color:var(--dim);}

.grp-lbl{
  font-size:var(--ts-xs);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);padding:14px 12px 5px;
}
/* Was rgba(251,146,60,.45) — 2.53:1 at 10px/700. --p at full opacity is 7.4:1. */
.grp-lbl.personal{color:var(--p);}
.grp-sep{height:1px;background:var(--border);margin:6px 12px;}

/* Nav rows are real <button>s inside a <nav> landmark (they were <div onclick> with an
   implicit tabIndex of -1 — the entire primary navigation was keyboard-unreachable).
   min-height 44px meets the touch-target floor; the old rows measured 37px. */
.nav{
  display:flex;align-items:center;gap:9px;padding:8px 11px;min-height:44px;
  width:100%;text-align:left;background:none;font:inherit;
  border-radius:10px;cursor:pointer;color:var(--muted);
  border:1px solid transparent;
  transition:background .15s,color .15s,border-color .15s;user-select:none;
}
.nav:hover{background:rgba(255,255,255,.04);color:var(--text);}
.nav.active{
  background:linear-gradient(90deg,rgba(110,168,255,.14),rgba(167,139,250,.07));
  border-color:var(--border-hi);color:var(--text);
}
.nav.pers.active{
  background:linear-gradient(90deg,rgba(251,146,60,.13),rgba(251,191,36,.06));
  border-color:rgba(251,146,60,.38);
}
.nav svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;flex-shrink:0;}
.nav .nm{flex:1;font-size:var(--ts-sm);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav .pc{font-size:10px;color:var(--dim);font-family:Sora;}
.nav .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}

/* Search affordance — 20 views, 12 projects, 63 phases and no way to find any of them by name. */
.side-search{
  display:flex;align-items:center;gap:8px;width:100%;min-height:44px;margin-bottom:8px;
  padding:8px 11px;border-radius:10px;cursor:pointer;font:inherit;text-align:left;
  color:var(--dim);background:rgba(255,255,255,.02);border:1px solid var(--border);
}
.side-search:hover{color:var(--text);border-color:var(--border-hi);}
.side-search svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;flex-shrink:0;}
.side-search .lbl{flex:1;font-size:var(--ts-sm);}
.side-search kbd{font-size:9px;}

/* Dormant projects (0 commits in 14 days) collapse behind a disclosure rather than spending
   the same nav weight as the project with 197 commits. */
.nav-more{
  display:flex;align-items:center;gap:6px;width:100%;min-height:44px;padding:6px 12px;
  background:none;border:0;cursor:pointer;font:600 var(--ts-xs)/1 Inter,sans-serif;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:left;
}
.nav-more:hover{color:var(--muted);}
.nav-more::after{content:"▾";font-size:9px;}
.nav-more[aria-expanded="true"]::after{content:"▴";}

.side-foot{margin-top:auto;padding:14px 10px 2px;font-size:var(--ts-xs);color:var(--dim);}
.side-foot .warn{color:var(--amber);}
.reload-btn{
  display:flex;align-items:center;gap:6px;width:100%;margin-top:9px;min-height:44px;
  padding:7px 12px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-size:11px;
  font-family:Inter,sans-serif;cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;text-align:left;
}
.reload-btn:hover{background:rgba(110,168,255,.1);color:var(--w);border-color:var(--border-hi);}
.reload-btn svg{width:12px;height:12px;flex-shrink:0;}
.reload-btn.spinning svg{animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Main ──────────────────────────────────── */
main{flex:1;padding:var(--sp-6) var(--sp-6) 60px;min-width:0;}
.crumbs{font-size:11px;color:var(--dim);margin-bottom:3px;}
h2.page{font-size:var(--ts-lg);font-weight:700;letter-spacing:-.01em;margin-bottom:3px;}
.sub{color:var(--muted);margin-bottom:20px;max-width:82ch;font-size:var(--ts-base);}
.mtabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid rgba(255,255,255,.08);}
.mtab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:inherit;font-size:var(--ts-base);font-weight:600;padding:8px 15px;cursor:pointer;transition:color .15s,border-color .15s;margin-bottom:-1px;}
.mtab:hover{color:var(--text);}
.mtab.on{color:var(--w);border-bottom-color:var(--w);}
.mdbody{font-size:var(--ts-base);color:var(--text);line-height:1.6;}
.mdbody h1,.mdbody h2,.mdbody h3,.mdbody h4{font-family:Sora;color:#fff;margin:18px 0 8px;line-height:1.3;}
.mdbody h1{font-size:20px;}.mdbody h2{font-size:var(--ts-md);border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:5px;}.mdbody h3{font-size:var(--ts-md);}.mdbody h4{font-size:var(--ts-base);color:var(--muted);}
.mdbody p{margin:7px 0;color:var(--muted);}
.mdbody code{background:rgba(110,168,255,.1);color:var(--w);padding:1px 5px;border-radius:4px;font-size:12px;}
.mdbody pre.mdcode{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);border-radius:7px;padding:12px;overflow:auto;font-size:12px;}
.mdbody pre.mdcode code{background:none;padding:0;color:var(--text);}
.mdbody ul{margin:7px 0;padding-left:20px;color:var(--muted);}.mdbody li{margin:3px 0;}
.mdbody a{color:var(--w);text-decoration:none;}.mdbody a:hover{text-decoration:underline;}
.mdbody hr{border:none;border-top:1px solid rgba(255,255,255,.08);margin:16px 0;}
.mdbody table.mdtable{border-collapse:collapse;width:100%;margin:10px 0;font-size:12px;}
.mdbody .mdtable th{text-align:left;color:var(--muted);font-weight:600;padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.12);text-transform:uppercase;font-size:var(--ts-xs);letter-spacing:.04em;}
.mdbody .mdtable td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.05);}
.mdbody .mdtable tr:hover td{background:rgba(110,168,255,.04);}

/* ── Pills ─────────────────────────────────── */
.pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;border:1px solid transparent;
}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;}
.p-active {color:var(--status-ok);   background:rgba(52,211,153,.1);  border:1px solid rgba(52,211,153,.28);}
.p-gated  {color:var(--status-warn); background:rgba(251,191,36,.1);  border:1px solid rgba(251,191,36,.28);}
.p-paused {color:var(--status-info); background:rgba(110,168,255,.08);border:1px solid rgba(110,168,255,.2);}
.p-dormant{color:var(--status-dim);  background:rgba(93,104,128,.1);  border:1px solid rgba(93,104,128,.22);}

/* ── Cards ─────────────────────────────────── */
.card{
  background:rgba(22,30,54,.94);
  border:1px solid rgba(255,255,255,.11);
  border-radius:var(--r);padding:var(--sp-4) var(--sp-5);
  backdrop-filter:blur(16px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 8px rgba(0,0,0,.5),0 14px 36px rgba(0,0,0,.28);
}
.card h3{
  font-size:var(--ts-xs);font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.12em;margin-bottom:12px;
}
.card.glow{
  border-color:rgba(110,168,255,.36);
  animation:wglow 3.5s ease-in-out infinite;
}
.card.pglow{
  border-color:rgba(251,146,60,.3);
  animation:pglow 3.5s ease-in-out infinite;
}
@keyframes wglow{
  0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 8px rgba(0,0,0,.5),0 14px 36px rgba(0,0,0,.28),0 0 0 1px rgba(110,168,255,.08);}
  50%{box-shadow:inset 0 1px 0 rgba(110,168,255,.14),0 2px 8px rgba(0,0,0,.5),0 16px 44px rgba(0,0,0,.32),0 0 32px rgba(110,168,255,.16);}
}
@keyframes pglow{
  0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 8px rgba(0,0,0,.5),0 14px 36px rgba(0,0,0,.28),0 0 0 1px rgba(251,146,60,.07);}
  50%{box-shadow:inset 0 1px 0 rgba(251,146,60,.12),0 2px 8px rgba(0,0,0,.5),0 16px 44px rgba(0,0,0,.32),0 0 28px rgba(251,146,60,.14);}
}

/* ── Stat row ──────────────────────────────── */
.stat-row{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
.stat{
  flex:1;min-width:110px;padding:13px 15px;
  background:rgba(18,26,48,.92);border:1px solid rgba(255,255,255,.1);border-radius:11px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 8px rgba(0,0,0,.4);
  cursor:default;
}
.stat .v{font-family:Sora;font-size:var(--ts-xl);font-weight:700;line-height:1;}
.stat .l{font-size:var(--ts-xs);color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin-top:3px;}
.stat.st-ok .v    {color:var(--status-ok);}
.stat.st-warn .v  {color:var(--status-warn);}
.stat.st-danger .v{color:var(--status-danger);}
.stat.st-info .v  {color:var(--status-info);}
.stat[data-id]{cursor:pointer;transition:border-color .15s;}
.stat[data-id]:hover{border-color:var(--border-hi);}

/* ── Section headers ───────────────────────── */
.sec-hd{display:flex;align-items:center;gap:12px;margin:0 0 14px;}
.sec-hd .t{font-size:var(--ts-xs);font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);white-space:nowrap;}
.sec-hd .ln{flex:1;height:1px;background:var(--border);}
.sec-hd.pers .t{color:rgba(251,146,60,.55);}
.sec-hd.pers .ln{background:rgba(251,146,60,.14);}

/* ── Grid ──────────────────────────────────── */
.g{display:grid;gap:var(--sp-3);}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
.span4{grid-column:span 4;}
.span2{grid-column:span 2;}

/* ── Donut ─────────────────────────────────── */
.donut{position:relative;flex-shrink:0;}
.donut svg{transform:rotate(-90deg);display:block;}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut .mid .n{font-family:Sora;font-weight:700;}
.donut .mid .t{font-size:var(--ts-xs);color:var(--dim);text-transform:uppercase;letter-spacing:.07em;}
.donut circle.val{transition:stroke-dashoffset .9s cubic-bezier(.22,1,.36,1);}

/* ── Progress bars ─────────────────────────── */
.phases{display:flex;flex-direction:column;gap:9px;}
.ph .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;gap:6px;}
.ph .nm{font-size:var(--ts-sm);font-weight:500;flex:1;min-width:0;}
.ph .pv{font-family:Sora;font-weight:600;font-size:12px;color:var(--muted);}

/* Phase note — the dataset carries ledger paragraphs (largest is 8,064 chars). Clamp to two
   lines by default and let the reader open the full text in place; nothing is truncated away. */
.ph .nt{font-size:var(--ts-sm);color:var(--muted);line-height:1.5;margin-top:5px;}
.ph .nt.clamped{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
/* Same contract as the phase note, for ledger prose that lands outside a phase row: the audit
   run summary is 2,894 chars on the largest project and one history "type" field runs 397. */
.clamp2.clamped{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.nt-more{
  display:inline-flex;align-items:center;gap:4px;margin-top:4px;padding:4px 8px;margin-left:-8px;
  font:600 var(--ts-xs)/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;
  color:var(--w);background:none;border:0;border-radius:6px;cursor:pointer;font-family:inherit;
}
.nt-more:hover{background:rgba(110,168,255,.10);}
.nt-more::after{content:"▾";font-size:9px;}
.nt-more[aria-expanded="true"]::after{content:"▴";}

/* Status chip derived from the note's leading token (ACTIVE / CLOSED / LIVE / ON HOLD / …). */
.phchip{
  flex-shrink:0;font:700 var(--ts-xs)/1 Inter,sans-serif;letter-spacing:.08em;
  padding:3px 6px;border-radius:5px;border:1px solid currentColor;white-space:nowrap;
}
.phchip.c-live,.phchip.c-closed{color:var(--status-ok);}
.phchip.c-active{color:var(--status-info);}
.phchip.c-partial,.phchip.c-conditional{color:var(--status-warn);}
.phchip.c-hold,.phchip.c-proposal,.phchip.c-placeholder{color:var(--status-dim);}

/* Phase groups. A check-in reads "what's moving" first; the largest project stacks 18 phases and
   renders closed work at the same weight as live work. Grouping keeps every phase on the page and
   folds the ones you are not acting on today. */
.ph-group+.ph-group{margin-top:6px;}
.ph-gh{
  display:flex;align-items:center;gap:8px;width:100%;padding:9px 0;
  background:none;border:0;border-top:1px solid var(--border);cursor:pointer;text-align:left;
  font:700 var(--ts-xs)/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);font-family:inherit;
}
.ph-gh:hover{color:var(--muted);}
.ph-gh::before{content:"▸";font-size:10px;letter-spacing:0;transition:transform .15s;}
.ph-gh[aria-expanded="true"]{color:var(--muted);}
.ph-gh[aria-expanded="true"]::before{transform:rotate(90deg);}
.ph-gh .gct{margin-left:auto;font-weight:600;letter-spacing:.04em;color:var(--dim);}
.ph-group .phases{padding-top:4px;}

/* Hero status note — the same ledger prose as a phase note, at hero width. Three lines, then
   open in place. */
.hero-note{font-size:var(--ts-sm);color:var(--muted);line-height:1.55;margin-top:11px;}
.hero-note.clamped{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}

/* Project detail: reading column + action rail. The phases card is the only thing on this page that
   runs ~1,800px, and the old 50/50 right column ran out at ~825px — a full screen of dead space
   beside the one card you actually scroll. Everything you act on now lives in the rail, level with
   the phases instead of stacked below them. */
.proj-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:var(--sp-3);align-items:start;margin-bottom:14px;}
.proj-col{display:flex;flex-direction:column;gap:var(--sp-3);min-width:0;}
@media(max-width:1080px){
  /* One column: the things you act on come first, not after 1,800px of phase rows. */
  .proj-grid{grid-template-columns:minmax(0,1fr);}
  .proj-rail{order:-1;}
}
/* Run history is a three-column row at page width. In the rail it stacks — the same treatment the
   phone breakpoint already gives it, applied by container position rather than viewport. */
.proj-rail .ah-row{grid-template-columns:minmax(0,1fr);gap:5px;}
.proj-rail .ah-when{flex-direction:row;align-items:baseline;gap:8px;}
.bar{height:7px;border-radius:5px;background:var(--track);overflow:hidden;}
.bar i{display:block;height:100%;width:0;border-radius:5px;
  background:linear-gradient(90deg,var(--w),var(--w2));
  box-shadow:0 0 8px rgba(110,168,255,.28);
  transition:width .9s cubic-bezier(.22,1,.36,1);}
.bar i.full{background:linear-gradient(90deg,var(--green),#19b07f);box-shadow:0 0 8px rgba(52,211,153,.22);}
.pers-bars .bar i{background:linear-gradient(90deg,var(--p),var(--p2));box-shadow:0 0 8px rgba(251,146,60,.22);}

/* mini bars */

/* ── Heat grid ─────────────────────────────── */
.heat{display:flex;gap:3px;align-items:center;}
/* The 14-day strip is fixed-width and can't shrink, so on a phone the row it sits in has to wrap
   rather than push the timestamp past the viewport. (`display:flex` is inline on that div; only
   flex-wrap is overridable from here — hence the class rather than a media-query display change.) */
.ov-actfoot{flex-wrap:wrap;row-gap:6px;}
.hc{width:15px;height:15px;border-radius:3px;background:var(--track);flex-shrink:0;transition:opacity .2s;}
.hc:hover{opacity:.7;}
.hc.h1{background:rgba(110,168,255,.18);}
.hc.h2{background:rgba(110,168,255,.42);}
.hc.h3{background:rgba(110,168,255,.68);}
.hc.h4{background:rgba(110,168,255,.92);}
.pers .hc.h1{background:rgba(251,146,60,.18);}
.pers .hc.h2{background:rgba(251,146,60,.42);}
.pers .hc.h3{background:rgba(251,146,60,.68);}
.pers .hc.h4{background:rgba(251,146,60,.9);}

/* ── Badges ────────────────────────────────── */
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;}
.badge{
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 8px;border-radius:6px;font-size:var(--ts-xs);font-weight:600;
  background:var(--panel2);border:1px solid var(--border);color:var(--dim);
}
.badge.st-ok     {color:var(--status-ok);    border-color:rgba(52,211,153,.28); background:rgba(52,211,153,.06);}
.badge.st-warn   {color:var(--status-warn);  border-color:rgba(251,191,36,.28); background:rgba(251,191,36,.05);}
.badge.st-danger {color:var(--status-danger);border-color:rgba(248,113,113,.28);background:rgba(248,113,113,.05);}
.badge.st-info   {color:var(--status-info);  border-color:rgba(110,168,255,.28);background:rgba(110,168,255,.06);}
.badge.info{color:var(--w);    border-color:rgba(110,168,255,.22); background:rgba(110,168,255,.06);}

/* ── Focus chip ────────────────────────────── */
.focus{
  margin-top:11px;padding:9px 13px;border-radius:10px;
  background:linear-gradient(100deg,rgba(110,168,255,.11),rgba(167,139,250,.05));
  border:1px solid rgba(110,168,255,.22);font-size:var(--ts-sm);color:var(--muted);
}
.focus b{display:block;color:var(--w);font-size:var(--ts-xs);text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px;}
.focus-p{background:linear-gradient(100deg,rgba(251,146,60,.09),rgba(251,191,36,.04));border-color:rgba(251,146,60,.22);}
.focus-p b{color:var(--p);}

/* ── Timeline ──────────────────────────────── */
.tl{display:flex;flex-direction:column;gap:10px;}
.tl-i{display:flex;gap:9px;align-items:flex-start;}
.tl-dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex-shrink:0;margin-top:5px;}
.tl-dot.now{background:var(--green);box-shadow:0 0 6px rgba(52,211,153,.5);}
.tl-dot.new{background:var(--w);}
.tl-body{flex:1;min-width:0;}
.tl-date{font-size:10px;color:var(--dim);font-family:Sora;}
.tl-text{font-size:var(--ts-sm);color:var(--muted);line-height:1.45;}

/* ── Wave panel ────────────────────────────── */
.wave-sum{display:flex;gap:8px;margin-bottom:12px;}
.wpip{flex:1;text-align:center;padding:8px 4px;background:var(--panel3);border:1px solid var(--border);border-radius:9px;}
.wpip .wn{font-family:Sora;font-size:var(--ts-md);font-weight:700;line-height:1;}
.wpip .wl{font-size:var(--ts-xs);color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
.wi{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--border);}
.wi:last-child{border-bottom:none;}
.wst{font-size:var(--ts-xs);font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;margin-top:2px;}
.wbody{flex:1;min-width:0;}
.wtitle{font-size:12px;color:var(--muted);font-weight:500;}
.wnote{font-size:var(--ts-xs);color:var(--dim);margin-top:1px;}

/* ── Audit ─────────────────────────────────── */
.sevcounts{display:flex;gap:7px;flex-wrap:wrap;}
.sevpip{display:flex;flex-direction:column;align-items:center;min-width:55px;padding:9px 5px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);}
.sevpip.hot{border-color:rgba(248,113,113,.32);}
.sevpip .n{font-family:Sora;font-weight:700;font-size:var(--ts-md);}
.sevpip .k{font-size:var(--ts-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-top:1px;}
.sev{display:inline-flex;align-items:center;padding:1px 7px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.sev-critical{color:#fff;                  background:var(--status-danger);}
.sev-high    {color:var(--status-danger);  background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.35);}
.sev-medium  {color:var(--status-warn);    background:rgba(251,191,36,.08); border:1px solid rgba(251,191,36,.30);}
.sev-low     {color:var(--status-dim);     background:rgba(93,104,128,.08); border:1px solid rgba(93,104,128,.22);}
.sev-info{color:var(--dim);background:rgba(120,130,150,.08);border:1px solid var(--border);}
.find{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border);}
.find:last-child{border-bottom:none;}
.find .fid{font-family:Sora;font-size:var(--ts-xs);color:var(--muted);min-width:76px;padding-top:1px;}
.find .ft{flex:1;font-size:var(--ts-sm);}.find .fw{color:var(--dim);font-size:11px;}
.auditrow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:8px;}
.auditrow:last-child{border-bottom:none;}.auditrow:hover{background:rgba(255,255,255,.03);}
.auditrow .anm{flex:1;font-weight:600;}
.trend.improving{color:var(--green);font-weight:600;}
.trend.flat{color:var(--dim);}
.trend.worsening{color:var(--red);font-weight:600;}
.clean{color:var(--green);font-size:var(--ts-sm);display:inline-flex;align-items:center;gap:6px;}
/* audit run history */
.ah{margin-top:15px;padding-top:13px;border-top:1px solid var(--border);}
.ah-h{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:11px;}
.ah-row{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:14px;align-items:start;padding:10px 0;border-bottom:1px solid var(--border);}
.ah-row:last-child{border-bottom:none;}
.ah-when{display:flex;flex-direction:column;gap:2px;}
.ah-date{font-family:Sora,sans-serif;font-size:12px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;}
.ah-type{font-size:var(--ts-xs);color:var(--dim);line-height:1.35;}
.ah-body{min-width:0;}
.ah-result{font-size:12px;color:var(--text);line-height:1.5;}
.ah-scope{font-size:var(--ts-xs);color:var(--dim);margin-top:3px;}
/* Clickable (auViewReport) — 10px monospace left it an 18px-tall target, so pad it to the 24px
   AA floor rather than growing the type. */
.ah-ref{font-family:ui-monospace,Consolas,monospace;font-size:10px;color:var(--dim);white-space:nowrap;flex-shrink:0;
  display:inline-flex;align-items:center;min-height:24px;}
@media(max-width:640px){
  .ah-row{grid-template-columns:minmax(0,1fr);gap:5px;}
  .ah-when{flex-direction:row;align-items:baseline;gap:8px;}
  .ah-ref{display:none;}
}
.au-latest{font-size:var(--ts-sm);color:var(--muted);margin-top:2px;}
.au-run{font-size:var(--ts-sm);color:var(--muted);line-height:1.5;margin-top:5px;}
.au-latest b{color:var(--text);font-family:Sora,sans-serif;font-weight:600;}
/* interactive severity pills + per-project breakdown */
.sevpill{cursor:pointer;user-select:none;transition:filter .15s,border-color .15s;}
.sevpill:hover,.sevpill:focus-visible{filter:brightness(1.3);outline:none;}
.sevpill[aria-expanded="true"]{border-color:var(--muted);}
.sevpill .caret{margin-left:5px;opacity:.55;font-size:9px;}
.au-break{display:none;margin:10px 0 4px;padding:6px 18px 12px;}
.au-break.open{display:block;}
.au-break-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:var(--ts-sm);flex-wrap:wrap;}
.au-break-row:last-child{border-bottom:none;}
.au-break-n{font-family:Sora,sans-serif;font-weight:700;min-width:26px;text-align:right;}
.au-break-nm{font-weight:600;flex:1;min-width:140px;}
.au-break-meta{color:var(--dim);font-size:var(--ts-xs);}
.au-jump{color:var(--muted);font-size:var(--ts-xs);cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
.au-jump:hover{color:var(--text);}
.au-flash{animation:auFlash 1.4s ease;}
@keyframes auFlash{0%{background:rgba(248,113,113,.14);}100%{background:transparent;}}
@media(prefers-reduced-motion:reduce){.au-flash{animation:none;}}
.badge.clickable{cursor:pointer;}
.badge.clickable:hover{filter:brightness(1.3);}
.au-break-head{border-bottom:1px solid var(--border);}
.au-break-list{max-height:340px;overflow-y:auto;padding:2px 0 4px;}
.au-carry{color:var(--dim);font-size:10px;border:1px solid var(--border);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap;}
/* in-app report viewer */
.au-modal-bg{position:fixed;inset:0;background:rgba(6,8,12,.72);backdrop-filter:blur(3px);z-index:90;display:flex;align-items:center;justify-content:center;padding:26px;}
.au-modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;max-width:920px;width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 18px 60px rgba(0,0,0,.5);}
.au-modal-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);font-family:Sora,sans-serif;font-weight:600;}
.au-modal-h span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.au-modal-x{background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:15px;line-height:1;padding:4px 9px;cursor:pointer;}
.au-modal-x:hover{color:var(--text);border-color:var(--muted);}
.au-modal-body{overflow-y:auto;padding:16px 22px 22px;font-size:var(--ts-sm);line-height:1.6;}
.au-modal-body.mdbody table.mdtable{font-size:11.5px;}

/* ── Git warn ──────────────────────────────── */
.gwarn{
  margin-top:10px;padding:8px 12px;border-radius:9px;font-size:var(--ts-sm);
  background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.22);color:var(--amber);
}

/* ── Lists ─────────────────────────────────── */
ul.alist{list-style:none;display:flex;flex-direction:column;gap:7px;}
ul.alist li{display:flex;gap:8px;align-items:flex-start;font-size:var(--ts-sm);color:var(--muted);}
ul.alist li::before{content:"→";color:var(--w);flex-shrink:0;font-weight:700;}
ul.alist li.blk::before{content:"⬥";color:var(--red);}
ul.alist li.dec::before{content:"◆";color:var(--amber);}
ul.alist li.rem::before{content:"○";color:var(--dim);}
.links a{color:var(--w);text-decoration:none;font-size:var(--ts-sm);display:inline-block;margin:0 14px 6px 0;}
.links a:hover{text-decoration:underline;}
.path-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--w);background:rgba(110,168,255,.06);border:1px solid rgba(110,168,255,.18);border-radius:5px;cursor:pointer;padding:3px 9px;margin:0 8px 6px 0;font-family:inherit;text-decoration:none;transition:background .15s,border-color .15s,color .15s;}
.path-chip:hover{background:rgba(110,168,255,.12);border-color:rgba(110,168,255,.38);color:#fff;}
.path-chip.copied{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.4);color:var(--green);}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:rgba(30,38,58,.96);border:1px solid rgba(110,168,255,.3);border-radius:8px;padding:8px 18px;font-size:var(--ts-base);color:var(--text);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:999;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.empty{color:var(--dim);font-style:italic;font-size:var(--ts-sm);}
code{background:var(--panel2);border:1px solid var(--border);padding:1px 6px;border-radius:5px;font-size:var(--ts-sm);}

/* ── Activity chart ────────────────────────── */
.chart-wrap{margin-top:4px;}
.chart-wrap svg{display:block;width:100%;height:auto;}
.axis{font-size:var(--ts-xs);fill:var(--dim);font-family:Inter;}

/* ── Phase popup ───────────────────────────── */
.ph-click{cursor:pointer;border-radius:8px;padding:5px 7px;margin:-5px -7px;transition:background .14s;}
.ph-click:hover{background:rgba(110,168,255,.07);}
.ph-click:hover .nm{color:var(--w);}
.ph-click::after{content:"↗";font-size:var(--ts-xs);color:var(--dim);margin-left:5px;opacity:0;transition:opacity .14s;vertical-align:1px;}
.ph-click:hover::after{opacity:1;}
.tsumm{font-size:var(--ts-xs);color:var(--dim);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;}
.ts-done{color:var(--green);}.ts-active{color:var(--w);}.ts-blocked{color:var(--red);}
.pp{
  position:fixed;z-index:1000;min-width:290px;max-width:450px;max-height:72vh;
  overflow-y:auto;background:#181f32;
  border:1px solid rgba(110,168,255,.38);border-radius:13px;
  padding:17px 19px;box-shadow:0 24px 70px rgba(0,0,0,.65);
  animation:ppIn .15s cubic-bezier(.22,1,.36,1);
}
@keyframes ppIn{from{opacity:0;transform:translateY(-5px) scale(.98)}to{opacity:1;transform:none}}
.pp-head{display:flex;align-items:flex-start;gap:9px;margin-bottom:5px;}
.pp-title{font-family:Sora;font-weight:700;font-size:var(--ts-base);flex:1;line-height:1.3;}
.pp-pct{font-family:Sora;font-weight:700;font-size:16px;color:var(--w);white-space:nowrap;flex-shrink:0;}
.pp-x{width:22px;height:22px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;padding:0;line-height:1;transition:background .14s,color .14s;}
.pp-x:hover{background:rgba(255,255,255,.08);color:var(--text);}
.pp-mb{height:4px;border-radius:3px;background:var(--track);margin:7px 0;overflow:hidden;}
.pp-mb-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--w),var(--w2));transition:width .6s cubic-bezier(.22,1,.36,1);}
.pp-note{font-size:var(--ts-sm);color:var(--muted);margin:0 0 11px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.pp-tasks{display:flex;flex-direction:column;gap:7px;}
.tr{display:flex;align-items:flex-start;gap:8px;}
.ti{width:17px;height:17px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:var(--ts-xs);font-weight:700;margin-top:1px;}
.ti.done{background:rgba(52,211,153,.1);color:var(--green);border:1px solid rgba(52,211,153,.24);}
.ti.active{background:rgba(110,168,255,.1);color:var(--w);border:1px solid rgba(110,168,255,.24);}
.ti.pending{background:rgba(255,255,255,.03);color:var(--dim);border:1px solid var(--border);}
.ti.blocked{background:rgba(248,113,113,.08);color:var(--red);border:1px solid rgba(248,113,113,.24);}
.tb{flex:1;min-width:0;}
.tl2{font-size:var(--ts-sm);font-weight:500;line-height:1.35;}
.tn{font-size:11px;color:var(--dim);margin-top:1px;line-height:1.35;}

/* ── Fade-in ───────────────────────────────── */
.fade{opacity:0;transform:translateY(6px);animation:rise .45s cubic-bezier(.22,1,.36,1) forwards;}
@keyframes rise{to{opacity:1;transform:none;}}
/* Fix: when glow+fade coexist, combine both animations so rise isn't overridden */
.card.glow.fade{animation:rise .45s cubic-bezier(.22,1,.36,1) forwards,wglow 3.5s ease-in-out .5s infinite;}
.card.pglow.fade{animation:rise .45s cubic-bezier(.22,1,.36,1) forwards,pglow 3.5s ease-in-out .5s infinite;}
@media(prefers-reduced-motion:reduce){
  .fade{animation:none;opacity:1;transform:none;}
  .bar i,.donut circle.val{transition:none;}
  .card.glow,.card.pglow{animation:none;}
}

/* ── Card accent borders ───────────────────── */
.ca-blue  {border-left:4px solid var(--status-info);   padding-left:18px;background:rgba(110,168,255,.04);}
.ca-green {border-left:4px solid var(--status-ok);     padding-left:18px;background:rgba(52,211,153,.04);}
.ca-amber {border-left:4px solid var(--status-warn);   padding-left:18px;background:rgba(251,191,36,.03);}
.ca-red   {border-left:4px solid var(--status-danger); padding-left:18px;background:rgba(248,113,113,.04);}
.ca-purple{border-left:4px solid rgba(167,139,250,.75);padding-left:18px;background:rgba(167,139,250,.04);}
.ca-grey  {border-left:4px solid var(--status-dim);    padding-left:18px;}

/* ── Project hero card ─────────────────────── */
.proj-hero{
  background:linear-gradient(155deg,rgba(26,38,72,.98) 0%,rgba(16,22,48,.96) 100%);
  border-color:rgba(110,168,255,.42);
  box-shadow:inset 0 1px 0 rgba(110,168,255,.14),0 2px 8px rgba(0,0,0,.55),0 18px 48px rgba(0,0,0,.35),0 0 40px rgba(110,168,255,.07);
}
.proj-hero-p{
  background:linear-gradient(155deg,rgba(56,34,18,.98) 0%,rgba(30,18,8,.96) 100%);
  border-color:rgba(251,146,60,.38);
  box-shadow:inset 0 1px 0 rgba(251,146,60,.12),0 2px 8px rgba(0,0,0,.55),0 18px 48px rgba(0,0,0,.35),0 0 36px rgba(251,146,60,.07);
}

/* ── Colored card h3 labels ────────────────── */
.h3-blue  .card h3,.card.h3-blue h3  {color:rgba(110,168,255,.7);}
.h3-green .card h3,.card.h3-green h3 {color:rgba(52,211,153,.7);}
.h3-amber .card h3,.card.h3-amber h3 {color:rgba(251,191,36,.6);}
.h3-red   .card h3,.card.h3-red h3   {color:rgba(248,113,113,.7);}
.h3-purple.card h3,.card.h3-purple h3{color:rgba(167,139,250,.7);}

/* ── Stat tile colored accents ─────────────── */
.stat.st-ok     {border-left:3px solid var(--status-ok);    background:rgba(52,211,153,.05);}
.stat.st-warn   {border-left:3px solid var(--status-warn);  background:rgba(251,191,36,.04);}
.stat.st-danger {border-left:3px solid var(--status-danger);background:rgba(248,113,113,.05);}
.stat.st-info   {border-left:3px solid var(--status-info);  background:rgba(110,168,255,.05);}

/* ── Overview hero card ────────────────────── */
.ov-hero{
  background:linear-gradient(145deg,rgba(24,34,66,.99) 0%,rgba(18,26,54,.97) 60%,rgba(24,18,54,.94) 100%);
  border-color:rgba(110,168,255,.42);
  box-shadow:inset 0 1px 0 rgba(110,168,255,.15),0 4px 12px rgba(0,0,0,.55),0 20px 52px rgba(0,0,0,.35),0 0 48px rgba(110,168,255,.08);
}

/* ── Section header enhanced ───────────────── */
.sec-hd .t{
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;
  background:linear-gradient(90deg,var(--w),var(--w2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.sec-hd.pers .t{
  background:linear-gradient(90deg,var(--p),var(--p2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

/* ── Responsive ────────────────────────────── */
/* 1200px grid override removed — auto-fit handles column reflow */
@media(max-width:900px){
  .app{flex-direction:column;}
  aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:10px;}
  .side-foot,.grp-lbl,.grp-sep{display:none;}
  main{padding:16px 15px 50px;min-width:0;}
  /* minmax(0,1fr), not 1fr: a bare `fr` track is minmax(auto,1fr), and the auto minimum is the
     item's min-content — a phase card measured 557px min-content and stretched the track past a
     360px viewport. Flooring the min at 0 lets the track obey the container. */
  .g,.g2,.g3,.g4{grid-template-columns:minmax(0,1fr);}
  .span4,.span2{grid-column:span 1;}
}
/* graph */
.gmg{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px;}
@media(max-width:900px){.gmg{grid-template-columns:repeat(2,minmax(0,1fr));}}

/* ── Strategy view ─────────────────────────────────────────────────── */
.strat-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.strat-tab{background:rgba(22,30,54,.9);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px 13px;font-size:12px;color:var(--muted);cursor:pointer;transition:all .15s;font-family:inherit;}
.strat-tab:hover{border-color:rgba(110,168,255,.35);color:var(--text);}
.strat-tab.active{background:rgba(110,168,255,.13);border-color:rgba(110,168,255,.44);color:#fff;}
.strat-tab .tc{display:inline-block;margin-left:5px;background:rgba(255,255,255,.08);border-radius:4px;padding:1px 6px;font-size:10px;}
.strat-tab.active .tc{background:rgba(110,168,255,.2);}
.strat-sr{display:flex;align-items:center;gap:7px;margin-bottom:18px;flex-wrap:wrap;}
.strat-sp{background:transparent;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:4px 11px;font-size:11px;color:var(--dim);cursor:pointer;transition:all .15s;font-family:inherit;text-transform:capitalize;}
.strat-sp:hover{border-color:rgba(255,255,255,.18);color:var(--muted);}
.strat-sp.active{border-color:rgba(110,168,255,.42);color:var(--w);background:rgba(110,168,255,.08);}
.strat-add-btn{margin-left:auto;background:rgba(110,168,255,.1);border:1px solid rgba(110,168,255,.28);border-radius:8px;padding:6px 14px;font-size:12px;color:var(--w);cursor:pointer;font-family:inherit;transition:all .15s;font-weight:500;}
.strat-add-btn:hover{background:rgba(110,168,255,.18);border-color:rgba(110,168,255,.5);}
.strat-form{background:rgba(16,24,46,.97);border:1px solid rgba(110,168,255,.28);border-radius:14px;padding:20px 22px;margin-bottom:16px;box-shadow:inset 0 1px 0 rgba(110,168,255,.1),0 4px 20px rgba(0,0,0,.4);}
.strat-form label{font-size:var(--ts-xs);font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);display:block;margin-bottom:5px;}
.strat-form input,.strat-form textarea,.strat-form select{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.11);border-radius:8px;padding:8px 12px;color:var(--text);font-family:inherit;font-size:var(--ts-base);margin-bottom:12px;outline:none;transition:border-color .15s;display:block;}
.strat-form input:focus,.strat-form textarea:focus,.strat-form select:focus{border-color:rgba(110,168,255,.5);}
.strat-form textarea{min-height:80px;resize:vertical;}
.strat-form select option{background:#131928;}
.strat-fbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
.sf-save{background:rgba(110,168,255,.12);border:1px solid rgba(110,168,255,.38);border-radius:7px;padding:7px 18px;color:var(--w);cursor:pointer;font-family:inherit;font-size:var(--ts-sm);font-weight:600;transition:all .15s;}
.sf-save:hover{background:rgba(110,168,255,.2);}
.sf-cancel{background:transparent;border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:7px 18px;color:var(--muted);cursor:pointer;font-family:inherit;font-size:var(--ts-sm);transition:all .15s;}
.sf-cancel:hover{border-color:rgba(255,255,255,.2);color:var(--text);}
.strat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:13px;}
.strat-card{background:rgba(22,30,54,.94);border:1px solid rgba(255,255,255,.11);border-radius:14px;padding:18px 20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 8px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.25);transition:border-color .18s,opacity .18s;display:flex;flex-direction:column;}
.strat-card:hover{border-color:rgba(255,255,255,.19);}
.strat-card.denied{opacity:.38;}
.strat-ct{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.strat-cat-lbl{font-size:var(--ts-xs);font-weight:700;text-transform:uppercase;letter-spacing:.12em;}
.strat-stat-lbl{font-size:var(--ts-xs);font-weight:700;text-transform:uppercase;letter-spacing:.1em;}
.strat-title{font-family:Sora;font-size:var(--ts-base);font-weight:600;color:var(--text);margin-bottom:8px;line-height:1.42;}
.strat-body{font-size:12px;color:var(--muted);line-height:1.65;flex:1;margin-bottom:14px;}
.strat-acts{display:flex;gap:6px;margin-top:auto;}
.sa{flex:1;border-radius:7px;padding:6px 8px;font-size:11px;cursor:pointer;border:1px solid;font-family:inherit;transition:all .15s;font-weight:500;text-align:center;}
.sa-ok{background:rgba(52,211,153,.06);border-color:rgba(52,211,153,.22);color:var(--status-ok);}
.sa-ok:hover{background:rgba(52,211,153,.13);border-color:rgba(52,211,153,.48);color:var(--green);}
.sa-ok.on{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.6);color:var(--green);font-weight:700;}
.sa-rs{background:rgba(110,168,255,.06);border-color:rgba(110,168,255,.2);color:var(--status-info);}
.sa-rs:hover{background:rgba(110,168,255,.13);border-color:rgba(110,168,255,.46);color:var(--w);}
.sa-rs.on{background:rgba(110,168,255,.16);border-color:rgba(110,168,255,.58);color:var(--w);font-weight:700;}
.sa-no{background:rgba(248,113,113,.05);border-color:rgba(248,113,113,.18);color:var(--status-danger);}
.sa-no:hover{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.44);color:var(--red);}
.sa-no.on{background:rgba(248,113,113,.15);border-color:rgba(248,113,113,.55);color:var(--red);font-weight:700;}
.sa-del{background:transparent;border-color:rgba(255,255,255,.08);color:var(--dim);max-width:34px;}
.sa-del:hover{border-color:rgba(248,113,113,.35);color:var(--red);}
/* ── Workflow lanes: in-progress, group sections, minimized completed, denied bucket ── */
.strat-card.inprogress{border-color:rgba(167,139,250,.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1px rgba(167,139,250,.1),0 10px 28px rgba(0,0,0,.25);}
.strat-ip-badge{font-size:var(--ts-xs);font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--w2);background:rgba(167,139,250,.14);border:1px solid rgba(167,139,250,.3);border-radius:5px;padding:2px 6px;white-space:nowrap;}
.strat-section{margin-bottom:24px;}
.strat-section-hdr{display:flex;align-items:center;margin:0 2px 11px;padding-bottom:7px;border-bottom:1px solid rgba(255,255,255,.07);}
/* The whole header row is the disclosure control, same as the Toolkit's — one target, and it
   reads to a screen reader as a single labelled toggle instead of a heading beside a mystery arrow. */
.strat-sec-toggle{display:flex;align-items:center;gap:9px;width:100%;min-height:32px;background:none;border:0;padding:0;cursor:pointer;font-family:inherit;text-align:left;}
.strat-sec-caret{width:7px;height:7px;flex-shrink:0;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(-45deg);transition:transform .16s;}
.strat-sec-toggle[aria-expanded="true"] .strat-sec-caret{transform:rotate(45deg);}
.strat-sec-toggle:hover .strat-sec-caret{border-color:var(--text);}
.strat-sec-toggle:hover .ct{color:var(--text);}
.strat-section-hdr .nm{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
.strat-section-hdr .ct{font-size:10px;color:var(--dim);background:rgba(255,255,255,.05);border-radius:5px;padding:1px 7px;transition:color .14s;}
.strat-sec-empty{font-size:12px;color:var(--dim);font-style:italic;padding:2px 2px 0;}
.strat-minstack{display:flex;flex-direction:column;gap:4px;margin-top:11px;}
.strat-min{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:8px;background:rgba(255,255,255,.022);border:1px solid rgba(255,255,255,.05);opacity:.7;transition:opacity .12s,background .12s;}
.strat-min:hover{opacity:1;background:rgba(255,255,255,.045);}
.strat-min .dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 6px rgba(52,211,153,.55);}
.strat-min.denied .dot{background:var(--red);box-shadow:0 0 6px rgba(248,113,113,.55);}
.strat-min .mt{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.strat-min .mc{font-size:var(--ts-xs);font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);flex-shrink:0;}
.strat-min .mr{background:transparent;border:1px solid rgba(255,255,255,.1);border-radius:5px;color:var(--dim);font-size:11px;padding:2px 8px;cursor:pointer;font-family:inherit;flex-shrink:0;transition:all .12s;}
.strat-min .mr:hover{color:var(--w);border-color:rgba(110,168,255,.4);background:rgba(110,168,255,.08);}
.strat-denied{margin-top:14px;border:1px solid rgba(248,113,113,.16);border-radius:12px;background:rgba(248,113,113,.03);overflow:hidden;}
.strat-denied-hdr{display:flex;align-items:center;gap:9px;padding:11px 16px;cursor:pointer;user-select:none;transition:background .12s;}
.strat-denied-hdr:hover{background:rgba(248,113,113,.05);}
.strat-denied-hdr .dl{font-size:12px;font-weight:600;color:rgba(248,113,113,.85);}
.strat-denied-hdr .dc{font-size:10px;color:var(--dim);background:rgba(255,255,255,.05);border-radius:5px;padding:1px 7px;}
.strat-denied-body{padding:4px 13px 13px;display:flex;flex-direction:column;gap:4px;}
/* ── Quick Capture & Priority ─────────────────────────────────────────── */
.strat-capture{background:rgba(14,20,42,.97);border:1px solid rgba(255,255,255,.09);border-radius:14px;margin-bottom:18px;overflow:hidden;}
.strat-cap-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;cursor:pointer;user-select:none;transition:background .15s;}
.strat-cap-hdr:hover{background:rgba(255,255,255,.025);}
.strat-cap-title{font-size:var(--ts-sm);font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;}
.strat-cap-cnt{background:rgba(251,146,60,.18);color:var(--p);border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700;}
.strat-cap-body{padding:0 18px 18px;border-top:1px solid rgba(255,255,255,.06);}
.strat-cap-ta{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:10px 14px;color:var(--text);font-family:inherit;font-size:var(--ts-base);resize:vertical;min-height:72px;outline:none;margin-top:14px;transition:border-color .15s;display:block;}
.strat-cap-ta:focus{border-color:rgba(110,168,255,.45);}
.strat-cap-save{margin-top:8px;background:rgba(110,168,255,.1);border:1px solid rgba(110,168,255,.28);border-radius:7px;padding:6px 16px;color:var(--w);cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;transition:all .15s;}
.strat-cap-save:hover{background:rgba(110,168,255,.18);}
.cap-list{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
.cap-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start;}
.cap-ts{font-size:10px;color:var(--dim);white-space:nowrap;flex-shrink:0;padding-top:2px;}
.cap-text{font-size:var(--ts-sm);color:var(--muted);flex:1;line-height:1.55;}
.cap-acts{display:flex;gap:5px;flex-shrink:0;}
.cap-promote{background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.22);border-radius:6px;padding:4px 10px;font-size:var(--ts-xs);color:rgba(52,211,153,.85);cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;}
.cap-promote:hover{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.45);}
.cap-del{background:transparent;border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:4px 8px;font-size:var(--ts-xs);color:var(--dim);cursor:pointer;font-family:inherit;transition:all .15s;}
.cap-del:hover{border-color:rgba(248,113,113,.35);color:var(--red);}
/* ── Toolkit (its own cleaner, lower-noise treatment) ─────────── */
.tk-intro{color:var(--muted);font-size:var(--ts-base);margin:2px 0 18px;max-width:660px;line-height:1.6;}
.tk-controls{display:flex;flex-direction:column;gap:11px;margin-bottom:24px;}
.tk-search{width:100%;padding:11px 16px;background:var(--panel3);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:inherit;font-size:var(--ts-base);outline:none;transition:border-color .15s;}
.tk-search::placeholder{color:var(--dim);}
.tk-search:focus{border-color:var(--border-hi);}
.tk-chips{display:flex;flex-wrap:wrap;gap:7px;}
.tk-chip{font-family:inherit;font-size:var(--ts-sm);font-weight:500;color:var(--muted);background:transparent;border:1px solid var(--border);border-radius:999px;padding:5px 13px;cursor:pointer;transition:color .14s,border-color .14s,background .14s;user-select:none;}
.tk-chip:hover{color:var(--text);border-color:var(--border-hi);}
.tk-chip.on{color:var(--bg);background:var(--text);border-color:var(--text);font-weight:600;}
.tk-section{margin-bottom:30px;}
.tk-sec-head{display:flex;flex-direction:column;gap:3px;margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--border);}
.tk-sec-top{display:flex;align-items:baseline;gap:8px;}
/* The whole section header is the disclosure control — a wider target than a lone caret, and
   it reads as one thing to a screen reader instead of a heading next to a mystery button. */
.tk-sec-toggle{
  display:flex;align-items:center;gap:9px;width:100%;min-height:36px;
  background:none;border:0;padding:0;cursor:pointer;font-family:inherit;text-align:left;
}
.tk-sec-caret{
  width:8px;height:8px;flex-shrink:0;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);
  transform:rotate(-45deg);transition:transform .16s;margin-left:2px;
}
.tk-sec-toggle[aria-expanded="true"] .tk-sec-caret{transform:rotate(45deg);}
.tk-sec-toggle:hover .tk-sec-caret{border-color:var(--text);}
.tk-sec-toggle:hover h3{color:var(--w);}
.tk-sec-head h3{font-family:Sora,sans-serif;font-size:var(--ts-md);font-weight:600;color:var(--text);letter-spacing:-.01em;transition:color .14s;}
.tk-sec-count{
  font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;
  background:var(--track);border-radius:20px;padding:2px 9px;margin-left:auto;
}
.tk-sec-ctx{font-size:var(--ts-sm);color:var(--dim);}
.tk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px;}
.tk-card{background:var(--panel3);border:1px solid var(--border);border-radius:14px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:7px;transition:border-color .14s,transform .14s;}
.tk-card:hover{border-color:var(--border-hi);transform:translateY(-1px);}
.tk-card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.tk-name{font-family:Sora,sans-serif;font-size:var(--ts-base);font-weight:600;color:var(--text);line-height:1.3;}
.tk-tag{font-size:var(--ts-xs);font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;margin-top:2px;}
.c-command{color:var(--w);background:rgba(110,168,255,.1);}
.c-skill{color:var(--w2);background:rgba(167,139,250,.1);}
.c-agent{color:var(--w3);background:rgba(52,211,153,.1);}
.c-cowork{color:var(--p2);background:rgba(251,191,36,.1);}
.c-connector{color:#5eead4;background:rgba(94,234,212,.1);}
.c-scheduled{color:var(--p);background:rgba(251,146,60,.1);}
.c-script{color:#f472b6;background:rgba(244,114,182,.1);}
.tk-desc{font-size:12px;color:var(--muted);line-height:1.55;}
.tk-card-f{display:flex;align-items:center;gap:9px;margin-top:auto;padding-top:5px;flex-wrap:wrap;}
.tk-cmd{display:inline-flex;align-items:center;gap:6px;max-width:100%;font-family:ui-monospace,'Cascadia Code','SFMono-Regular',Consolas,monospace;font-size:var(--ts-sm);color:var(--text);background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:7px;padding:4px 9px;cursor:pointer;transition:color .14s,border-color .14s;}
.tk-cmd>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tk-cmd svg{width:12px;height:12px;flex-shrink:0;opacity:.45;}
.tk-cmd:hover{border-color:var(--border-hi);color:var(--w);}
.tk-cmd:hover svg{opacity:.85;}
.tk-cmd.done{color:var(--green);border-color:rgba(52,211,153,.45);}
.tk-where{font-size:var(--ts-xs);color:var(--dim);}
.tk-trig{font-size:11px;color:var(--dim);line-height:1.45;margin-top:1px;}
.tk-empty{text-align:center;color:var(--dim);font-size:var(--ts-base);padding:48px 0;}
.tk-hidden{display:none!important;}
@media(max-width:640px){
  .tk-grid,.strat-grid{grid-template-columns:minmax(0,1fr);gap:11px;}
  .tk-sec-ctx{display:none;}
  .tk-card{padding:14px;}
  .tk-chips{gap:6px;}
}

/* ── Wave 1: Design System Token Layer ──────────────────────────── */
/* Section heading — fills the 21px→10px heading cliff */
.sh{font-family:Sora,sans-serif;font-size:var(--ts-md);font-weight:600;color:var(--text);margin:var(--sp-5) 0 var(--sp-3);}
.sh small{font-size:var(--ts-xs);font-weight:600;text-transform:uppercase;letter-spacing:.10em;color:var(--muted);margin-left:8px;}

/* Unified status component classes — one system for ok/warn/danger/info/dim */
.st-ok    {color:var(--status-ok);    border-color:rgba(52,211,153,.30);    background:rgba(52,211,153,.06);}
.st-warn  {color:var(--status-warn);  border-color:rgba(251,191,36,.28);    background:rgba(251,191,36,.05);}
.st-danger{color:var(--status-danger);border-color:rgba(248,113,113,.28);   background:rgba(248,113,113,.05);}
.st-info  {color:var(--status-info);  border-color:rgba(110,168,255,.28);   background:rgba(110,168,255,.06);}
.st-dim   {color:var(--status-dim);   border-color:rgba(93,104,128,.25);    background:rgba(93,104,128,.06);}

/* State components — for panels whose generator failed or returned empty */
.skel{background:linear-gradient(90deg,rgba(255,255,255,.03) 25%,rgba(255,255,255,.07) 50%,rgba(255,255,255,.03) 75%);background-size:200% 100%;animation:skel-shimmer 1.4s ease infinite;border-radius:6px;}
@keyframes skel-shimmer{to{background-position:-200% 0;}}
.state-error  {color:var(--status-danger);font-size:var(--ts-sm);display:flex;align-items:center;gap:6px;padding:var(--sp-3) 0;}
.state-empty  {color:var(--muted);font-size:var(--ts-sm);font-style:italic;padding:var(--sp-4) 0;}
.state-unavail{color:var(--status-dim);font-size:var(--ts-xs);text-transform:uppercase;letter-spacing:.04em;padding:var(--sp-3) 0;}
@media(prefers-reduced-motion:reduce){.skel{animation:none;background:rgba(255,255,255,.05);}}

/* ── Wave 3: Overview hierarchy redesign ─────────────────────────── */
/* Command bar — health + counters */
.ov-cmd{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;margin-bottom:20px;flex-wrap:wrap;}
.ov-cmd.clear {border:1px solid rgba(52,211,153,.20); background:rgba(52,211,153,.05);}
.ov-cmd.warn  {border:1px solid rgba(251,191,36,.25);  background:rgba(251,191,36,.05);}
.ov-cmd.danger{border:1px solid rgba(248,113,113,.25); background:rgba(248,113,113,.05);}
.ov-cmd-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ov-cmd.clear  .ov-cmd-dot{background:var(--status-ok);}
.ov-cmd.warn   .ov-cmd-dot{background:var(--status-warn);}
.ov-cmd.danger .ov-cmd-dot{background:var(--status-danger);}
.ov-cmd-items{display:flex;align-items:center;gap:8px;flex:1;flex-wrap:wrap;}
.ov-cmd-meta{font-size:var(--ts-xs);color:var(--dim);white-space:nowrap;}

/* Focus block — primary content slot in hero card */
.ov-focus{font-size:var(--ts-sm);line-height:1.6;color:var(--text);padding:10px 14px;
  background:rgba(110,168,255,.05);border-left:3px solid var(--status-info);
  border-radius:0 6px 6px 0;margin-bottom:16px;}
.ov-focus-lbl{display:block;font-size:var(--ts-xs);font-weight:700;text-transform:uppercase;
  letter-spacing:.10em;color:var(--status-info);margin-bottom:5px;}

/* Compact cards — satellite + personal */
.ov-compact{cursor:pointer;}
.ov-compact .ov-nm{font-family:Sora;font-size:var(--ts-base);font-weight:700;
  display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.ov-compact .ov-sub{font-size:var(--ts-sm);color:var(--dim);line-height:1.45;margin-bottom:3px;}
.ov-compact .ov-foot{display:flex;align-items:center;gap:8px;margin-top:8px;}

/* Group labels (replaces .sec-hd for overview) */
.ov-group{font-size:var(--ts-xs);font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  color:var(--dim);margin:20px 0 10px;display:flex;align-items:center;gap:10px;}
.ov-group::after{content:'';flex:1;height:1px;background:var(--border);}
/* .55 alpha composited to 3.27:1 on the page base — under AA at this 10px size. .78 keeps the
   label reading as a muted accent rather than a heading, and clears the threshold. */
.ov-group.pers{color:rgba(251,146,60,.78);}
.ov-group.pers::after{background:rgba(251,146,60,.14);}

/* ── Wave 4: Audit redesign ──────────────────────────────────────── */
/* Open finding cards — severity-led, project-attributed */
.au-finding-row{display:flex;gap:14px;align-items:flex-start;}
.au-sev-col{flex-shrink:0;padding-top:2px;}
.au-finding-body{flex:1;min-width:0;}
.au-finding-title{font-size:var(--ts-sm);font-weight:600;font-family:Sora,sans-serif;line-height:1.5;margin-bottom:6px;}
.au-finding-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--ts-xs);color:var(--muted);}
.au-where{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-family:'Fira Code',monospace;font-size:10px;}
.au-confirmed{color:var(--dim);font-style:italic;}

/* Clean project cards — compact */
.au-clean{cursor:pointer;}
.au-clean-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:var(--ts-xs);color:var(--dim);margin-top:8px;}
.au-compact-hist{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.au-hist-row{display:flex;gap:10px;align-items:baseline;padding:3px 0;}
.au-hist-date{font-size:var(--ts-xs);color:var(--dim);white-space:nowrap;min-width:72px;font-family:Sora,sans-serif;}
.au-hist-result{font-size:var(--ts-xs);color:var(--muted);line-height:1.45;}

/* ── Wave 5: Codebase redesign ──────────────────────────────────── */
.cb-risk-row{display:flex;gap:14px;align-items:flex-start;}
.cb-risk-num{font-size:var(--ts-xl);font-weight:800;line-height:1;color:var(--status-danger);flex-shrink:0;min-width:34px;padding-top:2px;text-align:right;}
.cb-risk-body{flex:1;min-width:0;}
.cb-risk-title{font-size:var(--ts-base);font-weight:700;font-family:Sora,sans-serif;margin-bottom:5px;}
.cb-risk-finding{font-size:var(--ts-sm);color:var(--muted);line-height:1.5;margin-bottom:8px;}
.cb-risk-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--ts-xs);color:var(--dim);}
.cb-gap-name{font-size:var(--ts-sm);font-weight:700;font-family:Sora,sans-serif;margin-bottom:3px;}
.cb-gap-sub{font-size:var(--ts-xs);color:var(--dim);margin-bottom:2px;}
.cb-gap-why{font-size:var(--ts-xs);color:var(--status-warn);margin-top:6px;}
/* Verified-clean signal: a measured zero, not an absent measurement. */
.cb-risk-num.ok{color:var(--status-ok);}
.cb-risk-num.watch{color:var(--status-warn);}
/* Blast-radius rows: bar = dependents, chip = 90d churn. Churn is what
   separates a real risk from a merely load-bearing hub. */
.cb-hub{display:flex;align-items:center;gap:9px;}
.cb-hub-name{min-width:210px;font-size:var(--ts-sm);font-family:Sora,sans-serif;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cb-hub-file{color:var(--dim);font-size:11px;}
.cb-hub-bar{flex:1;height:6px;border-radius:4px;background:var(--track);overflow:hidden;}
.cb-hub-fill{height:100%;transition:width .9s cubic-bezier(.22,1,.36,1);}
.cb-hub-deg{min-width:30px;font-size:11px;color:var(--dim);text-align:right;}
.cb-hub-churn{min-width:58px;font-size:10px;text-align:right;white-space:nowrap;}
.cb-hub-churn.hot{color:var(--status-danger);}
.cb-hub-churn.warm{color:var(--status-warn);}
.cb-hub-churn.cold{color:var(--dim);}
.cb-note{font-size:var(--ts-xs);color:var(--dim);line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}

/* ── Cross-tab pill/card interactivity (Overview/Roadmap/Codebase/Strategy/Usage/Toolkit) ── */
/* Presentation lives here rather than inline on the element so the responsive rules below can
   actually win — an inline `white-space:nowrap` kept these chips from wrapping on phones. */
.dag-chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;
  background:var(--track);font-size:12px;font-family:Sora,sans-serif;white-space:nowrap;
  cursor:pointer;transition:filter .15s;
}
.dag-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dag-chip:hover,.dag-chip:focus-visible{filter:brightness(1.35);outline:none;}
.lp-chip{cursor:pointer;transition:color .15s;border-radius:4px;}
.lp-chip:hover,.lp-chip:focus-visible{color:var(--w)!important;outline:none;}
.spend-chip{cursor:pointer;transition:opacity .15s;border-radius:6px;}
.spend-chip:hover,.spend-chip:focus-visible{opacity:.7;outline:none;}
.ca-tile{cursor:pointer;transition:filter .15s;}
.ca-tile:hover,.ca-tile:focus-visible{filter:brightness(1.18);outline:none;}
.stat.jumpable{cursor:pointer;transition:filter .15s;}
.stat.jumpable:hover,.stat.jumpable:focus-visible{filter:brightness(1.2);outline:none;}
.tk-sec-count.clickable{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;}
.tk-sec-count.clickable:hover{color:var(--muted);}

/* ══ Today — the daily check-in surface ════════════════════════════════════
   Four bands answering, in order: did anything break / what moved / what is
   waiting on me / where is the work happening. Everything below is derived
   from fields already in data.js; no schema change. */
.tv-head{display:flex;align-items:baseline;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-4);}
.tv-head .when{font-size:var(--ts-sm);color:var(--dim);margin-left:auto;}

.tv-sec{margin-bottom:var(--sp-6);}
.tv-sec > h3{
  font-family:Sora,sans-serif;font-size:var(--ts-xs);font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3);
}
.tv-sec > h3::after{content:'';flex:1;height:1px;background:var(--border);}
.tv-sec > h3 .ct{color:var(--muted);letter-spacing:.04em;}

/* Attention band */
.tv-alert{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-bottom:var(--sp-5);}
.tv-chip{
  display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;
  border-radius:10px;border:1px solid var(--border);background:var(--panel3);
  font-size:var(--ts-sm);font-weight:600;color:var(--text);
  cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s;
}
.tv-chip:hover{border-color:var(--border-hi);background:var(--panel2);}
.tv-chip .n{font-family:Sora;font-weight:700;font-size:var(--ts-md);}
.tv-chip.ok{border-color:rgba(52,211,153,.28);background:rgba(52,211,153,.06);cursor:default;}
.tv-chip.ok .n,.tv-chip.ok{color:var(--status-ok);}
.tv-chip.danger{border-color:rgba(248,113,113,.30);background:rgba(248,113,113,.06);}
.tv-chip.danger .n{color:var(--status-danger);}
.tv-chip.warn{border-color:rgba(251,191,36,.30);background:rgba(251,191,36,.05);}
.tv-chip.warn .n{color:var(--status-warn);}
.tv-chip svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;flex-shrink:0;}

/* Activity feed */
.tv-day{display:grid;grid-template-columns:92px minmax(0,1fr);gap:var(--sp-3);margin-bottom:var(--sp-3);}
.tv-date{
  font-family:Sora;font-size:var(--ts-xs);font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--dim);padding-top:7px;text-align:right;
}
.tv-date .rel{display:block;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);}
.tv-feed{display:flex;flex-direction:column;gap:2px;min-width:0;}
.tv-ev{
  display:flex;gap:var(--sp-2);align-items:flex-start;padding:11px 10px;min-height:44px;
  border-radius:8px;border:1px solid transparent;cursor:pointer;
  font-size:var(--ts-sm);line-height:1.5;color:var(--muted);text-align:left;
  background:none;font-family:inherit;width:100%;transition:background .14s;
}
.tv-ev:hover{background:rgba(110,168,255,.06);border-color:var(--border);}
.tv-ev .proj{
  flex-shrink:0;font-weight:600;color:var(--w);font-size:var(--ts-xs);
  text-transform:uppercase;letter-spacing:.05em;padding-top:2px;min-width:86px;
}
.tv-ev.new{background:rgba(110,168,255,.05);}
.tv-ev.new .txt::after{
  content:"NEW";margin-left:7px;font-size:9px;font-weight:700;letter-spacing:.1em;
  color:var(--status-info);border:1px solid rgba(110,168,255,.4);border-radius:4px;padding:1px 4px;
  vertical-align:1px;
}
.tv-ev .txt{flex:1;min-width:0;}

/* On your desk */
.tv-desk{display:flex;flex-direction:column;gap:var(--sp-2);}
.tv-item{
  display:flex;gap:var(--sp-3);align-items:flex-start;padding:11px var(--sp-3);
  border-radius:10px;border:1px solid var(--border);background:var(--panel3);
  cursor:pointer;text-align:left;width:100%;font-family:inherit;
  font-size:var(--ts-sm);line-height:1.55;color:var(--muted);transition:border-color .15s;
}
.tv-item:hover{border-color:var(--border-hi);}
.tv-kind{
  flex-shrink:0;font:700 var(--ts-xs)/1 Inter,sans-serif;letter-spacing:.07em;
  text-transform:uppercase;padding:4px 7px;border-radius:5px;border:1px solid currentColor;margin-top:1px;
}
.tv-kind.k-blocker{color:var(--status-danger);}
.tv-kind.k-decision{color:var(--status-warn);}
.tv-kind.k-reminder{color:var(--status-dim);}
.tv-item .body{flex:1;min-width:0;}
.tv-item .who{display:block;font-size:var(--ts-xs);font-weight:700;color:var(--w);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
.tv-item .body p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.tv-ref{color:var(--dim);font-weight:400;}
.tv-parked .tv-item{opacity:.6;}
.tv-parked .tv-item:hover{opacity:1;}

/* Needs-you: clear state + flagship metric */
.tv-clear{display:flex;gap:var(--sp-3);align-items:center;padding:15px var(--sp-4);border-radius:12px;
  border:1px solid rgba(52,211,153,.28);background:rgba(52,211,153,.06);}
.tv-clear svg{width:22px;height:22px;stroke:var(--status-ok);stroke-width:2;fill:none;flex-shrink:0;}
.tv-clear b{display:block;font-family:Sora;font-size:var(--ts-base);color:var(--w);}
.tv-clear span{display:block;font-size:var(--ts-sm);color:var(--muted);margin-top:2px;}
.tv-fm{display:flex;align-items:center;gap:9px;width:100%;margin-bottom:var(--sp-5);
  padding:11px var(--sp-4);border-radius:11px;border:1px solid var(--border);background:var(--panel3);
  cursor:pointer;font-family:inherit;text-align:left;transition:border-color .15s;}
.tv-fm:hover{border-color:var(--border-hi);}
.tv-fm .fm-hd{font-family:Sora;font-weight:700;font-size:var(--ts-sm);color:var(--w);}
.tv-fm .fm-n{font-family:Sora;font-weight:800;font-size:var(--ts-md);color:var(--status-ok);}
.tv-fm .fm-n.dim{color:var(--muted);}
.tv-fm .fm-l{font-size:var(--ts-xs);color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-left:-4px;}
.tv-fm .fm-sep{width:1px;height:16px;background:var(--border);}
.tv-fm .fm-go{margin-left:auto;font-size:var(--ts-xs);color:var(--dim);}
/* Overview flagship two-number headline */
.ov-ev{display:inline-flex;align-items:center;gap:5px;font-family:Sora;cursor:help;}
.ov-ev b{font-weight:800;font-size:var(--ts-base);color:var(--status-ok);}
.ov-ev b.dim{color:var(--muted);}
.ov-ev small{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;}
.ov-ev i{width:1px;height:14px;background:var(--border);display:inline-block;}

/* Movement */
.tv-move-cap{font-size:var(--ts-xs);color:var(--dim);margin:-2px 0 var(--sp-3);line-height:1.45;max-width:62ch;}
.tv-move{display:flex;flex-direction:column;gap:1px;}
.tv-row .pctv{cursor:help;}
.tv-row{
  display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:var(--sp-3);align-items:center;
  padding:10px var(--sp-3);border-radius:9px;border:1px solid transparent;
  cursor:pointer;width:100%;text-align:left;font-family:inherit;background:none;
  transition:background .14s,border-color .14s;
}
.tv-row:hover{background:rgba(110,168,255,.05);border-color:var(--border);}
.tv-row .nm{font-size:var(--ts-sm);font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.tv-row .nm small{display:block;font-weight:400;font-size:var(--ts-xs);color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tv-row .commits{font-family:Sora;font-size:var(--ts-sm);font-weight:700;color:var(--muted);
  min-width:52px;text-align:right;font-variant-numeric:tabular-nums;}
.tv-row .commits em{font-style:normal;font-size:var(--ts-xs);color:var(--dim);font-weight:400;}
.tv-row .pctv{font-family:Sora;font-size:var(--ts-sm);font-weight:700;color:var(--w);
  min-width:40px;text-align:right;}
.tv-spark{display:flex;gap:2px;align-items:flex-end;height:22px;width:76px;flex-shrink:0;}
.tv-spark i{flex:1;background:var(--w);border-radius:1px;min-height:2px;opacity:.75;}
.tv-spark i.z{background:var(--track);opacity:1;}
.tv-quiet{
  display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;
  padding:10px var(--sp-3);margin-top:var(--sp-2);
  border-top:1px solid var(--border);font-size:var(--ts-sm);color:var(--dim);
}
.tv-quiet .lbl{font-size:var(--ts-xs);font-weight:700;text-transform:uppercase;letter-spacing:.1em;}
.tv-quiet button{
  background:none;border:0;color:var(--muted);cursor:pointer;font-family:inherit;
  font-size:var(--ts-sm);padding:6px 8px;border-radius:6px;text-decoration:underline;
  text-decoration-style:dotted;text-underline-offset:3px;
  min-height:44px;display:inline-flex;align-items:center;
}
.tv-quiet button:hover{color:var(--w);background:rgba(110,168,255,.07);}

.tv-empty{font-size:var(--ts-sm);color:var(--dim);padding:var(--sp-3);
  border:1px dashed var(--border);border-radius:10px;}

@media(max-width:640px){
  .tv-day{grid-template-columns:minmax(0,1fr);gap:var(--sp-1);}
  .tv-date{text-align:left;padding-top:0;}
  .tv-ev{flex-direction:column;gap:2px;}
  .tv-row{grid-template-columns:minmax(0,1fr) auto;}
  .tv-spark{display:none;}
}

/* ══ Accessibility scaffolding ═════════════════════════════════════════════ */
.skip{
  position:absolute;left:-9999px;top:0;z-index:1200;min-height:44px;
  display:flex;align-items:center;
  padding:12px 18px;border-radius:0 0 10px 0;background:var(--w);color:#07080d;
  font-weight:700;font-size:var(--ts-sm);text-decoration:none;
}
.skip:focus{left:0;}
:focus-visible{outline:2px solid var(--w);outline-offset:2px;border-radius:4px;}

/* Target size. Primary navigation and standalone actions get the 44 px comfortable target
   (WCAG 2.5.5); the dense inline controls inside a card — pills, chips, "show more" toggles —
   get the 24 px AA minimum (WCAG 2.5.8), which is the exception these are written for. Forcing
   44 px on all ~950 of them would re-inflate every view the clamp work just shrank. */
.nav,.side-search,.tv-chip,.tv-item,.tv-row,.cp-it{min-height:44px;}
/* Sizing only — never `display`. These selectors match controls that already carry their own
   layout mode (.tv-row is a grid, .nav is a flex row); overriding display collapses them. */
#main button,#main [role="button"],aside button{min-height:24px;min-width:24px;}
/* The dense inline chips are the ones that need a display change: an inline box ignores
   min-height entirely, so they have to become inline-flex for the floor to bind. */
.nt-more,.sevpill,.lp-chip,.spend-chip,.dag-chip,.tk-chip,.tk-cmd,.bw-chip,.path-chip,
.strat-sp,.strat-pri,.mtab,.tk-sec-count.clickable,.sa,.badge.clickable{
  display:inline-flex;align-items:center;
}

/* Inline icon sized off the surrounding text, replacing the ⚠/⚡/✅ emoji that were being
   used as icons. Colour is inherited so every existing .warn/.st-warn rule still applies. */
.i-in{
  width:1em;height:1em;stroke:currentColor;stroke-width:2;fill:none;
  vertical-align:-.14em;margin-right:.34em;flex-shrink:0;
}

/* No horizontal scroll at any width. Ledger strings routinely contain long unbroken tokens
   (branch names, dotted paths, PR titles) that push flex/grid children past the viewport;
   these let them break instead. Measured offenders: phase names, DAG chips, card grids. */
/* `break-word` is inherited, so one declaration covers every ledger string in every view —
   raw URLs, dotted paths, branch names — and it only breaks a word that would otherwise
   overflow. `anywhere` additionally shrinks min-content, which is what flex and grid items
   need before their track can obey the container, so the layout boxes get it explicitly. */
#main,aside{overflow-wrap:break-word;}
.ph .row,.ph .nm,.dag-chip,.tv-ev .txt,.tv-item .body,.tv-row .nm,
.wnote,.wbody,.wi,.nt,.ov-focus,.ah-row,.ah-body,.ah-result,.ah-ref{min-width:0;overflow-wrap:anywhere;}
.dag-chip{max-width:100%;}
@media(max-width:900px){
  aside{max-height:none;border-right:0;border-bottom:1px solid var(--border);}
  .card,.ph,.dag-chip,.tv-item,.tv-ev{max-width:100%;}
  /* Phase names run to ~45 characters; on a phone they have to wrap or the DAG scrolls sideways. */
  .dag-chip{white-space:normal;}
}

/* ══ Command palette (Ctrl/Cmd-K) ══════════════════════════════════════════ */
.cp-bg{position:fixed;inset:0;z-index:1100;background:rgba(3,5,10,.72);
  backdrop-filter:blur(3px);display:flex;justify-content:center;padding-top:12vh;}
.cp{
  width:min(620px,92vw);max-height:70vh;display:flex;flex-direction:column;
  background:var(--panel2);border:1px solid var(--border-hi);border-radius:var(--r);
  box-shadow:0 24px 70px rgba(0,0,0,.6);overflow:hidden;
}
.cp input{
  width:100%;padding:16px 18px;border:0;border-bottom:1px solid var(--border);
  background:none;color:var(--text);font:var(--ts-md)/1.4 Inter,sans-serif;
}
.cp input:focus{outline:none;}
.cp input::placeholder{color:var(--dim);}
.cp-list{overflow-y:auto;padding:6px;}
.cp-it{
  display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:44px;
  border-radius:8px;cursor:pointer;width:100%;text-align:left;background:none;
  border:0;font-family:inherit;font-size:var(--ts-sm);color:var(--muted);
}
.cp-it .t{flex:1;min-width:0;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cp-it .k{font-size:var(--ts-xs);color:var(--dim);text-transform:uppercase;letter-spacing:.08em;flex-shrink:0;}
.cp-it[aria-selected="true"]{background:rgba(110,168,255,.14);color:var(--text);}
.cp-it svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;flex-shrink:0;}
.cp-none{padding:22px;text-align:center;color:var(--dim);font-size:var(--ts-sm);}
.cp-foot{padding:8px 14px;border-top:1px solid var(--border);font-size:var(--ts-xs);color:var(--dim);
  display:flex;gap:14px;flex-wrap:wrap;}
kbd{font-family:"Fira Code",ui-monospace,monospace;font-size:10px;background:var(--panel3);
  border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--muted);}
</style>

<script>
const D=window.DASHBOARD_DATA;
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const WORK=['bimpossible','addins','site','families','bimpossible-workspace','dashboard-auto','bimpossible-tests'];

  {id:'usage',name:'Usage'},{id:'toolkit',name:'Toolkit'},{id:'bimwatch',name:'BIM Watch'},
];
const CPKEY=/Mac|iP(hone|ad)/.test(navigator.platform||navigator.userAgent)?'⌘K':'Ctrl K';
const ICO={
  sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',

// the sidebar badge, the audit "clean" list, and nothing at all for 8 other data
// files). Deliberately NOT one universal number: the local loop / daily pipeline files
// genuinely refresh on a ~day cadence, on-demand audit/graphify artifacts genuinely
// don't. ageHtml()'s 7/14d activity-recency color cue is a separate concern (how long
// since a PROJECT was worked on, not how old a data FILE's own render is) and
// intentionally isn't folded in here.
const FRESH={live:3,periodic:14,ci:3};
// Like daysAgo(), but accepts any Date-parseable value (bare "YYYY-MM-DD" from
// data.js/phase_dag.js, or full ISO timestamps like usage.js/agents.js/networkx_impact.js/
// codebase-meta.js/github_actions.js use) instead of assuming a bare date string.
function daysAgoAny(v){
  if(!v)return null;
  // A bare "YYYY-MM-DD" parses as UTC midnight per spec, but TODAY is local midnight -
  // reading it back with local getters below would silently misread it as the PREVIOUS
  // local day in any timezone behind UTC. Force local-time parsing here, same trick
  // daysAgo() already uses, before falling through to a direct parse for full timestamps

// is never computed twice and can never disagree between them. No global cache — the array
// is recomputed per project render and passed down explicitly. Returns [] without
// PhaseMetrics (alias resolution + dedupe live there) or when no cohort is declared.

function heat(series,isP){

// Phase notes are ledger prose, not labels — the longest in the current dataset is 8,064
// characters. Split the leading status token off into a chip, then clamp the remainder.
const PHCHIP=/^\s*([A-Z][A-Z0-9 \/&+.()-]{1,24}?)\s*(?:—|–|--|:)\s*/;
const PHCLS={LIVE:'live',CLOSED:'closed',ACTIVE:'active',PARTIAL:'partial',CONDITIONAL:'conditional',

  const tok=m[1].trim();
  // Only treat it as a status token if we recognise it (or a close variant) — otherwise the
  // regex happily eats the first clause of an ordinary sentence.
  const key=Object.keys(PHCLS).find(k=>tok===k||tok.startsWith(k+' ')||tok.startsWith(k+'('));

function areaChart(series,w,h,id){
  const n=series.length;if(!n)return'';
  const max=Math.max(...series.concat([1]));
  const pL=6,pR=6,pT=8,pB=16,iw=w-pL-pR,ih=h-pT-pB;
  const pts=series.map((v,i)=>[pL+iw*i/(n-1),pT+ih*(1-v/max)]);
  let d='M'+pts[0][0]+','+pts[0][1];
  for(let i=1;i<n;i++){const p0=pts[i-1],p1=pts[i],mx=(p0[0]+p1[0])/2;d+=` C${mx},${p0[1]} ${mx},${p1[1]} ${p1[0]},${p1[1]}`;}
  const area=d+` L${pts[n-1][0]},${pT+ih} L${pts[0][0]},${pT+ih} Z`;
  const start=new Date(D.activitySince+'T00:00:00');
  let ticks='';
  for(let i=0;i<n;i+=Math.ceil(n/5)){
    const dt=new Date(start.getTime()+i*86400000);
    ticks+=`<text class="axis" x="${pL+iw*i/(n-1)}" y="${h-3}" text-anchor="middle">${dt.getMonth()+1}/${dt.getDate()}</text>`;
  }
  const dots=pts.map((p,i)=>series[i]>0?`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--w)"><title>${series[i]} commits</title></circle>`:'').join('');
  return`<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="max-height:${h}px">
    <defs><linearGradient id="ag${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(110,168,255,.38)"/><stop offset="100%" stop-color="rgba(110,168,255,0)"/>
    </linearGradient></defs>
    <line x1="${pL}" y1="${pT+ih}" x2="${w-pR}" y2="${pT+ih}" stroke="var(--track)"/>
    <path d="${area}" fill="url(#ag${id})"/>
    <path d="${d}" fill="none" stroke="var(--w)" stroke-width="1.8"/>
    ${dots}${ticks}</svg></div>`;
}
