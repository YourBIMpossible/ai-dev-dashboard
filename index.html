function tlItem(raw){

function auViewReport(file,title){

    }).join('')+'</div>';

function project(p){
  if(!p)return'';

  const isP=PERS.includes(p.id);
  let h=`<div class="crumbs">Portfolio / ${esc(p.name)}</div>`
    +`<h2 class="page">${esc(p.name)} <span class="pill ${PILL[p.status]}" style="vertical-align:4px;margin-left:8px">${p.status}</span></h2>`

  h+=`<div style="flex:1;min-width:260px">`;
  // Check-in reading order: the call to action, then when it last moved, then the full status
  // paragraph. The status note is the longest prose on the page — BIMpossible Platform's runs
  // ~1,300 chars of #-numbered ledger detail — and it was set in bold display type above the
  // focus box, so the one line that says what to do arrived after fifteen lines that don't.
  // It keeps every word; it just no longer charges admission for the rest of the card.
  const statusNote=String(p.phase||'').trim();
  if(p.focus)h+=`<div class="focus${isP?' focus-p':''}" style="margin-top:0"><b>If you only do one thing</b>${esc(p.focus)}</div>`;
  h+=`<div style="font-size:12px;color:var(--muted);margin-top:${p.focus?'11px':'0'}">Last activity: <b>${esc((p.lastActivity&&p.lastActivity.date)||'?')}</b> (${ageHtml(p.lastActivity&&p.lastActivity.date)}) — ${esc((p.lastActivity&&p.lastActivity.summary)||'')}</div>`;
  if(p.branch)h+=`<div style="font-size:12px;color:var(--muted);margin-top:5px">Branch: <code>${esc(p.branch)}</code></div>`;
  if(statusNote){
    // Without a focus line the status note IS the summary, so it stays open.

    h+=`<div class="hero-note${fold?' clamped':''}" id="${sid}">${esc(statusNote)}</div>`;

  h+=`</div></div></div></div>`; // close: flex-1, flex-wrap, card, fade-wrapper

  // Everything below the hero is a reading column plus an action rail. Previously the phases card
  // sat beside a stack that ran out after ~825px while it kept going to ~1,800px, and the things
  // you actually act on — next actions, audit, key files — were stacked underneath, off-screen.
  // Now the rail carries them, level with the phases.
  const main=[],rail=[];

  // data-ord fixes each card's place in the reading order regardless of which column it ends up in;
  // data-move="1" marks the reference cards the balancer may relocate. The action set and the phase

  main.push(`<div class="card ca-blue${isP?' pers-bars':''}" data-ord="10"><h3>${esc((p.progress&&p.progress.label)||'Phases')} <span style="font-size:var(--ts-xs);color:var(--dim);font-weight:400;text-transform:none;letter-spacing:0">— click a phase for tasks</span></h3>${phaseBars(p.progress,p.id)}</div>`);

  // Rail order is the check-in order: what to do → what's stopping you → what needs your call →
  // what to keep half an eye on → quality state → pulse → where to jump in.
  rail.push(`<div class="card ca-blue" data-ord="20"><h3>Next actions</h3>`
    +((p.nextActions||[]).length
      ?`<ul class="alist">${p.nextActions.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`

  if((p.blockers||[]).length)rail.push(`<div class="card ca-red" data-ord="21"><h3>Blockers</h3><ul class="alist">${p.blockers.map(b=>`<li class="blk">${esc(b)}</li>`).join('')}</ul></div>`);
  if((p.pendingDecisions||[]).length)rail.push(`<div class="card ca-amber" data-ord="22"><h3>Decisions waiting on you</h3><ul class="alist">${p.pendingDecisions.map(d=>`<li class="dec">${esc(d)}</li>`).join('')}</ul></div>`);
  if((p.reminders||[]).length)rail.push(`<div class="card ca-grey" data-ord="23"><h3>Watch items</h3><ul class="alist">${p.reminders.map(r=>`<li class="rem">${esc(r)}</li>`).join('')}</ul></div>`);

  // Audit
  if(p.audit){
    const a=p.audit;const tot=SEVS.reduce((s,k)=>s+(a.counts[k]||0),0);
    let au=`<div class="card ca-green" data-ord="40" data-move="1"><h3>Audit</h3>`;
    au+=`<div class="au-latest">Latest run · <b>${esc(a.lastRun)}</b></div>`;
    // runType is a free-text ledger field, not a label — BIMpossible's is 2,894 chars and used to
    // render as one unbroken run-on beside the date.
    au+=foldText(a.runType,'au-run','Full run note');
    au+=`<div class="sevcounts" style="margin:13px 0 ${tot?'13px':'4px'}">`;
    SEVS.forEach(k=>{

      au+=`<div class="sevpip${(k==='critical'||k==='high')&&n?' hot':''}"><span class="n" style="color:${n?(k==='critical'?'var(--red)':k==='high'?'var(--amber)':'var(--text)'):'var(--dim)'}">${n}</span><span class="k">${SEVLBL[k]}</span></div>`;
    });
    au+=`</div>`;
    // The full open-findings list ran 4,200px on the largest project — taller than the whole
    // dedicated Audit view. Show the first six (severity-ordered upstream) and fold the rest.
    if(tot){
      const F=f=>`<div class="find"><span class="fid">${sevBadge(f.sev)}</span><div class="ft"><b style="font-family:Sora;font-weight:600">${esc(f.id)}</b> – ${esc(f.title)}${f.where?` <span class="fw">(${esc(f.where)})</span>`:''}</div></div>`;
      au+=`<div class="ah-h">Open findings · ${tot}</div>`+a.open.slice(0,6).map(F).join('');
      au+=revealBlock(a.open.slice(6).map(F).join(''),a.open.length-6,'finding');
    }
    else au+=`<p class="clean">${ICO.shield.replace('<svg',`<svg width="15" height="15" style="stroke:var(--green)">`)} No open findings — all clear as of the last run.</p>`;
    au+=`<p style="font-size:var(--ts-sm);color:var(--dim);margin-top:10px"><span class="trend ${a.trend||'flat'}">${a.trend||'flat'}</span> · ${a.closedLastRun||0} closed last run${a.cadence?' · '+esc(a.cadence):''}</p>`;
    au+=auditHistory(p);
    au+=`<div class="links" style="margin-top:8px">${pathLink(a.reportPath,'Full report')}${a.ledgerPath?pathLink(a.ledgerPath,'Audit ledger'):''}</div></div>`;
    rail.push(au);
  }

  rail.push(`<div class="card ca-grey" data-ord="50" data-move="1"><h3>Commit activity (14 days)</h3>${areaChart(p.activity||[],360,140,p.id+'x')}</div>`);
  if((p.links||[]).length)rail.push(`<div class="card ca-grey" data-ord="65" data-move="1"><h3>Key files</h3><div class="links">${p.links.map(l=>pathLink(l.path,l.label)).join('')}</div></div>`);

  // Waves and history are reference reading, not check-in actions — they start in the wide column
  // under the phases, where the wave grid and the timeline have room.
  if(p.waves){
    const w=p.waves;
    let wv=`<div class="card ca-purple" data-ord="60" data-move="1"><h3>Waves${w.updated?` <span style="font-size:var(--ts-xs);color:var(--dim);font-weight:400;text-transform:none;letter-spacing:0">ledger updated ${esc(w.updated)}</span>`:''}</h3>`;
    wv+=wavePanel(w);
    if(w.source)wv+=`<div class="links" style="margin-top:10px">${pathLink(w.source,'Wave ledger')}</div>`;
    main.push(wv+`</div>`);
  }
  if((p.recent||[]).length){
    main.push(`<div class="card ca-grey" data-ord="70" data-move="1"><h3>Recent activity</h3><div class="tl">${p.recent.map(tlItem).join('')}</div></div>`);
  }

  h+=`<div class="proj-grid fade" style="animation-delay:.05s">`
    +`<div class="proj-col">${main.join('')}</div>`
    +`<div class="proj-col proj-rail">${rail.join('')}</div>`
    +`</div>`;
  return h;
}

// The mix of card heights is wildly different per project — BIMpossible's phase list is 1,861px
// while Add-Ins' is 873px, and the audit card swings between 700px and 1,400px depending on how
// much ledger prose a run carried. Any fixed column assignment therefore strands a screen of dead
// space on one side or the other. After the view paints, move the cards marked movable to whichever
// column closes the gap, keeping each column in its declared reading order. Measured, not
// predicted: a card's height changes with the column it lands in, so each candidate move is tried,
// measured, and reverted if it did not help.
const PROJ_BALANCE_TOL=80;    // below this the columns already read as even — stop moving things
function balanceProjectGrid(){
  const g=document.querySelector('.proj-grid');
  if(!g)return;
  const main=g.firstElementChild,rail=g.lastElementChild;
  if(!main||main===rail)return;
  const gap=()=>Math.abs(main.offsetHeight-rail.offsetHeight);
  const sortCol=col=>[...col.children]
    .sort((a,b)=>(+a.dataset.ord||0)-(+b.dataset.ord||0))
    .forEach(c=>col.appendChild(c));
  // Stamp each card's declared column the first time we see it (the view renders fresh markup,
  // so a stamp always reflects project()'s own placement), then ALWAYS put cards back before
  // doing anything else. A move made at wide width must not survive a breakpoint change —
  // stacked layout renders rail-first (.proj-rail{order:-1}), so a leftover move puts a card
  // in the wrong reading order — and restoring first also means every wide pass balances from
  // the declared layout instead of compounding earlier moves.
  [...main.children].forEach(c=>{if(!c.dataset.home)c.dataset.home='main';});
  [...rail.children].forEach(c=>{if(!c.dataset.home)c.dataset.home='rail';});
  let restored=false;
  [...main.children,...rail.children].forEach(c=>{
    const home=c.dataset.home==='rail'?rail:main;
    if(c.parentElement!==home){home.appendChild(c);restored=true;}
  });
  if(restored){sortCol(main);sortCol(rail);}
  // Stacked at the narrow breakpoint — one column, nothing to balance, and moving cards there
  // would only scramble the reading order. Declared placement is already restored above.
  if(getComputedStyle(g).gridTemplateColumns.split(/\s+/).length<2)return;
  for(let pass=0;pass<4;pass++){
    const before=gap();
    if(before<=PROJ_BALANCE_TOL)return;
    const from=main.offsetHeight>rail.offsetHeight?main:rail,to=from===main?rail:main;
    let best=null,bestGap=before;
    for(const c of [...from.children]){
      if(c.dataset.move!=='1')continue;
      const after=c.nextElementSibling;
      to.appendChild(c);
      const g2=gap();
      if(g2<bestGap){bestGap=g2;best=c;}
      after?from.insertBefore(c,after):from.appendChild(c);   // revert; sortCol fixes order later
    }
    if(!best)return;
    to.appendChild(best);
    sortCol(from);sortCol(to);
  }
}
// Crossing the stacked/two-column breakpoint invalidates the placement, so redo it once the
// resize settles. No-ops on every view that has no project grid.
let _pbTimer=null;
window.addEventListener('resize',()=>{clearTimeout(_pbTimer);_pbTimer=setTimeout(balanceProjectGrid,180);});

// Generic "N more" disclosure. Content stays in the DOM — nothing is truncated away, it just
// starts folded so a reference list can't bury the cards below it.
let _rvSeq=0;
function revealBlock(html,n,noun){
  if(!html||n<=0)return'';
  const id='rv'+(++_rvSeq);
  return`<div id="${id}" hidden>${html}</div>`
    +`<button type="button" class="nt-more" aria-expanded="false" aria-controls="${id}" onclick="rvToggle(event,'${id}',${n},'${esc(noun)}')">`
    +`Show ${n} more ${esc(noun)}${n!==1?'s':''}</button>`;
}
function rvToggle(e,id,n,noun){
  e.stopPropagation();
  const el=document.getElementById(id);if(!el)return;
  el.hidden=!el.hidden;
  const btn=e.currentTarget;
  btn.setAttribute('aria-expanded',String(!el.hidden));
  btn.firstChild.nodeValue=el.hidden?`Show ${n} more ${noun}${n!==1?'s':''}`:'Show less';
}

// ── Audit view ───────────────────────────────────────────────────────────
function auditHistory(p){
  const hist=p.audit&&p.audit.history;
  if(!hist||!hist.length)return'';
  // Both fields are free-text ledger prose, not labels — the longest result in the dataset is
  // 2,372 chars and the longest type 397, so an unclamped row buried the runs under it. One
  // control opens the whole row; nothing is truncated away.
  const row=r=>{
    const type=String(r.type||''),res=String(r.result||''),scope=String(r.scope||'');
    const long=type.length>90||res.length>140||scope.length>110,c=long?' clamp2 clamped':'';
    const tid='ah'+(++_ntSeq),rid='ah'+(++_ntSeq),sid='ah'+(++_ntSeq);
    return`<div class="ah-row">`
      +`<div class="ah-when"><span class="ah-date">${esc(r.date||'')}</span><span class="ah-type${c}" id="${tid}">${esc(type)}</span></div>`
      +`<div class="ah-body"><div class="ah-result${c}" id="${rid}">${esc(res)}</div>`
      +(scope?`<div class="ah-scope${c}" id="${sid}">${esc(scope)}</div>`:'')
      +(long?`<button type="button" class="nt-more" aria-expanded="false" aria-controls="${rid} ${tid}${scope?' '+sid:''}" onclick="ntToggle(event,'${rid}','Full note')">Full note</button>`:'')
      +`</div>`
      // Values travel as escaped data-* attributes (esc covers the double-quoted attribute
      // context) and a delegated handler in show() reads them back via dataset — never as
      // inline JS string literals, where esc() would leave apostrophes free to break the
      // handler for a name like "owner's-review.md".
      +(r.report?`<span class="ah-ref au-jump" role="button" tabindex="0" title="read this report here" data-report-file="${esc(p.id+'/'+r.report)}" data-report-title="${esc(p.name+' — '+(r.date||'')+' report')}">${esc(r.report)}</span>`:'')
      +`</div>`;
  };
  return`<div class="ah"><div class="ah-h">Run history · ${hist.length} run${hist.length!==1?'s':''}</div>`
    +hist.slice(0,3).map(row).join('')
    +revealBlock(hist.slice(3).map(row).join(''),hist.length-3,'run')
    +`</div>`;
}
function auditView(){
  const wa=D.projects.filter(p=>p.audit);
  const agg={critical:0,high:0,medium:0,low:0,info:0};
  wa.forEach(p=>SEVS.forEach(k=>agg[k]+=(p.audit.counts[k]||0)));
  const totO=SEVS.reduce((s,k)=>s+agg[k],0);
  const closed=wa.reduce((s,p)=>s+(p.audit.closedLastRun||0),0);

  // Split: hot (has unresolved open findings) vs clean vs unaudited
  const hotProjs  =wa.filter(p=>(p.audit.open||[]).length>0);
  const cleanProjs=wa.filter(p=>(p.audit.open||[]).length===0);
  const noAudit   =D.projects.filter(p=>!p.audit);

  let h='<div class="crumbs">Audit</div><h2 class="page">Audit Findings</h2>';

  // 1. Command bar — portfolio health at a glance
  const hCls=totO>0?(agg.critical>0?'danger':'warn'):'clear';
  h+=`<div class="ov-cmd ${hCls} fade">`;
  h+=`<div class="ov-cmd-dot"></div>`;
  h+=`<div class="ov-cmd-items">`;
  if(totO===0){
    h+=`<span style="color:var(--status-ok);font-weight:600">All clear — no open findings across ${wa.length} audited projects</span>`;
  } else {
    SEVS.filter(k=>agg[k]).forEach(k=>{
      const cls=(k==='critical'||k==='high')?'st-danger':k==='medium'?'st-warn':'st-dim';
      const nP=wa.filter(p=>(p.audit.counts[k]||0)>0).length;
      h+=`<span class="badge ${cls} sevpill" role="button" tabindex="0" aria-expanded="false" data-sev="${k}" title="${agg[k]} open ${SEVLBL[k].toLowerCase()} finding${agg[k]!==1?'s':''} across ${nP} project${nP!==1?'s':''} — click for per-project breakdown" onclick="auPill('${k}')" onkeydown="auPillKey(event,'${k}')">${agg[k]} ${SEVLBL[k].toLowerCase()}<span class="caret">▾</span></span>`;
    });
  }
  h+=`</div>`;
  if(closed>0){
    const parts=wa.filter(p=>p.audit.closedLastRun).map(p=>`${p.name}: ${p.audit.closedLastRun}`).join(' · ');
    h+=`<span class="ov-cmd-meta" title="Closed in each project's most recent run — ${esc(parts)}">${closed} findings closed across recent audits</span>`;
  }
  h+=`</div>`;

  // Mechanical freshness check (check_audit_freshness.py): flags when a newer report
  // sits on disk than what this project's audit block reflects. Date comparison only —
  // never parses finding counts out of report prose. See project_local-dashboard-monitor.
  const AF=window.AUDIT_FRESHNESS&&window.AUDIT_FRESHNESS.projects;
  const staleOnDisk=AF?wa.filter(p=>AF[p.id]&&AF[p.id].stale):[];
  if(staleOnDisk.length){
    const list=staleOnDisk.map(p=>`${esc(p.name)} — newer report on disk (${esc(AF[p.id].newestOnDisk)}) not yet reflected here (shown: ${esc(p.audit.lastRun)})`).join(' · ');

  }

  // Per-severity breakdown panels (toggled by the pills above).
  // With local/audit-findings.js loaded (local monitor), each panel lists every finding inline;
  // without it (public deploy), it falls back to per-project rollups — reports never ship publicly.
  const FIND=window.AUDIT_FINDINGS_LOCAL||null;
  SEVS.filter(k=>agg[k]).forEach(k=>{
    const nCol=k==='critical'||k==='high'?'var(--status-danger)':k==='medium'?'var(--status-warn)':'var(--status-dim)';
    h+=`<div class="card au-break" id="au-break-${k}">`;

      const openRows=(p.audit.open||[]).filter(f=>f.sev===k).length;
      h+=`<div class="au-break-row au-break-head">`;
      h+=`<span class="au-break-n" style="color:${nCol}">${p.audit.counts[k]}</span>`;
      h+=`<span class="au-break-nm">${esc(p.name)}</span>`;
      h+=`<span class="au-break-meta">unresolved as of ${esc(p.audit.lastRun||'?')}</span>`;
      if(openRows)h+=`<span class="au-jump" onclick="auJump('${k}')">flash ${openRows} below ↓</span>`;
      if(p.audit.reportFile)h+=`<span class="au-jump" role="button" tabindex="0" data-report-file="${esc(p.audit.reportFile)}" data-report-title="${esc(p.name+' — latest audit report')}">read report here</span>`;
      if(p.audit.reportPath)h+=pathLink(p.audit.reportPath,'editor');
      h+=`</div>`;
      if(rows&&rows.length){
        h+=`<div class="au-break-list">`;
        rows.forEach(f=>{
          h+=`<div class="find"><span class="fid">${esc(f.id)}</span><span class="ft">${esc(f.t)}${f.s==='carry'?'<span class="au-carry" title="carried open from the 2026-07-01 deep audit">carry</span>':''}</span>${f.w?`<span class="fw">${esc(f.w)}</span>`:''}</div>`;
        });
        h+=`</div>`;
        if(rows.length!==(p.audit.counts[k]||0))h+=`<div class="au-break-meta" style="padding:6px 0">listing ${rows.length} of ${p.audit.counts[k]} — counts and local detail have drifted; re-run the audit refresh</div>`;
      }else{
        h+=`<div class="au-break-meta" style="padding:4px 0 8px">Item-level detail isn't bundled in this deployment (findings stay local by design) — read the report above on the local monitor.</div>`;
      }
    });
    h+=`</div>`;
  });

  // 2. Open findings — severity-led, project-attributed
  //    These are CURRENTLY UNRESOLVED items, NOT findings from the latest run.
  if(hotProjs.length){
    h+=`<div class="sh fade" style="animation-delay:.04s">Currently unresolved <small>${totO} finding${totO!==1?'s':''}</small></div>`;
    hotProjs.forEach((p,pi)=>{
      (p.audit.open||[]).forEach((f,fi)=>{
        const isCrit=(f.sev==='critical'||f.sev==='high');
        h+=`<div class="card ${isCrit?'ca-red':'ca-amber'} au-finding fade" data-sev="${esc(f.sev)}" style="animation-delay:${.06+pi*.04+fi*.02}s">`;
        h+=`<div class="au-finding-row">`;
        h+=`<div class="au-sev-col">${sevBadge(f.sev)}</div>`;
        h+=`<div class="au-finding-body">`;
        h+=`<div class="au-finding-title">${esc(f.id)} — ${esc(f.title)}</div>`;
        h+=`<div class="au-finding-meta">`;
        h+=(ICO[p.icon]||ICO.cube).replace('<svg',`<svg width="12" height="12" style="stroke:var(--muted);stroke-width:2;fill:none;flex-shrink:0"`);
        h+=`<span style="font-weight:600">${esc(p.name)}</span>`;
        if(f.where)h+=`<span class="au-where">${esc(f.where)}</span>`;
        h+=`<span class="au-confirmed">unresolved as of ${esc(p.audit.lastRun)}</span>`;
        const tCls=p.audit.trend==='improving'?'st-ok':p.audit.trend==='worsening'?'st-danger':'st-dim';
        h+=`<span class="badge ${tCls}">${p.audit.trend||'flat'}</span>`;
        h+=`</div></div></div></div>`;
      });
    });
  } else if(!totO){
    h+=`<div class="card ca-green fade" style="animation-delay:.04s;padding:18px 22px">`;
    h+=`<div class="clean" style="font-size:var(--ts-base)">${ICO.shield.replace('<svg',`<svg width="18" height="18" style="stroke:var(--status-ok)">`)} No open findings across ${wa.length} audited project${wa.length!==1?'s':''}</div>`;
    if(closed>0)h+=`<div style="font-size:var(--ts-sm);color:var(--muted);margin-top:6px">${closed} findings closed in the most recent runs</div>`;
    h+=`</div>`;
  }

  // 3. Clean projects — compact, with inline recent history
  if(cleanProjs.length){
    h+=`<div class="sh fade" style="animation-delay:.12s">Clean <small>${cleanProjs.length} project${cleanProjs.length!==1?'s':''}</small></div>`;
    h+=`<div class="g g${cleanProjs.length>1?'2':'1'} fade" style="animation-delay:.14s;margin-bottom:4px">`;
    cleanProjs.forEach(p=>{
      const age=daysAgo(p.audit.lastRun);
      const stale=age!==null&&age>FRESH.periodic;
      h+=`<div class="card au-clean" data-id="${p.id}">`;
      h+=`<div style="display:flex;align-items:center;gap:10px">`;
      h+=(ICO[p.icon]||ICO.cube).replace('<svg',`<svg width="14" height="14" style="stroke:var(--muted);stroke-width:2;fill:none;flex-shrink:0"`);
      h+=`<span style="font-family:Sora,sans-serif;font-weight:600;flex:1">${esc(p.name)}</span>`;
      h+=`<span style="color:var(--status-ok);font-size:var(--ts-sm)">✓ All clear</span>`;
      h+=`</div>`;
      h+=`<div class="au-clean-meta">`;
      h+=`<span>Last run ${esc(p.audit.lastRun)}${stale?` <span style="color:var(--status-warn)">(stale — ${age}d)</span>`:''}</span>`;
      if(p.audit.closedLastRun)h+=`<span style="color:var(--status-ok)">${p.audit.closedLastRun} closed last run</span>`;
      const tCls2=p.audit.trend==='improving'?'st-ok':p.audit.trend==='worsening'?'st-danger':'st-dim';
      h+=`<span class="badge ${tCls2}">${p.audit.trend||'flat'}</span>`;
      h+=`</div>`;
      if((p.audit.history||[]).length){
        h+=`<div class="au-compact-hist">`;
        p.audit.history.slice(0,2).forEach(r=>{
          h+=`<div class="au-hist-row"><span class="au-hist-date">${esc(r.date)}</span><span class="au-hist-result">${esc(r.result.slice(0,110))}${r.result.length>110?'…':''}</span></div>`;
        });
        if(p.audit.history.length>2)h+=`<div style="font-size:var(--ts-xs);color:var(--dim);padding-top:4px">+${p.audit.history.length-2} earlier runs — see project detail</div>`;
        h+=`</div>`;
      }
      h+=`<div class="links" style="margin-top:10px">${pathLink(p.audit.reportPath,'Latest report')}${p.audit.ledgerPath?pathLink(p.audit.ledgerPath,'Run ledger'):''}</div>`;
      h+=`</div>`;
    });
    h+=`</div>`;
  }

  // 4. Unaudited projects — tertiary, compact chips
  if(noAudit.length){
    h+=`<div class="sh fade" style="animation-delay:.20s">Not yet audited <small>${noAudit.length}</small></div>`;
    h+=`<div class="card fade" style="animation-delay:.22s;padding:12px 16px">`;
    h+=`<div style="display:flex;flex-wrap:wrap;gap:8px">`;
    noAudit.forEach(p=>{
      h+=`<div style="display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:8px;border:1px solid var(--border);font-size:var(--ts-sm);color:var(--dim)">`;
      h+=(ICO[p.icon]||ICO.cube).replace('<svg',`<svg width="12" height="12" style="stroke:var(--dim);stroke-width:2;fill:none;flex-shrink:0"`);
      h+=`<span>${esc(p.name)}</span>`;
      h+=`</div>`;
    });
    h+=`</div></div>`;
  }

  // 5. Full run history for hot projects — secondary, positioned last
  hotProjs.filter(p=>(p.audit.history||[]).length).forEach((p,i)=>{
    h+=`<div class="card fade" style="animation-delay:${.26+i*.04}s;margin-top:13px">`;
    h+=`<h3>${esc(p.name)} — run history</h3>`;
    h+=`<div class="au-latest" style="margin-bottom:10px">Last run <b>${esc(p.audit.lastRun)}</b> · ${esc(p.audit.runType||'')}</div>`;
    h+=auditHistory(p);
    h+=`<div class="links" style="margin-top:11px">${pathLink(p.audit.reportPath,'Latest report')}${p.audit.ledgerPath?pathLink(p.audit.ledgerPath,'Run ledger'):''}</div>`;
    h+=`</div>`;
  });

  return h;
}

// ── Graph view ───────────────────────────────────────────────────────────
function glChart(series,labels,w,h,id){
  const n=series.length;if(!n)return'';
  const max=Math.max(...series),min=Math.min(...series),range=max-min||1;
  const pL=32,pR=6,pT=8,pB=20,iw=w-pL-pR,ih=h-pT-pB;
  const pts=series.map((v,i)=>[pL+iw*(n>1?i/(n-1):.5),pT+ih*(1-(v-min)/range)]);
  let d='M'+pts[0][0]+','+pts[0][1];
  for(let i=1;i<n;i++){const p0=pts[i-1],p1=pts[i],mx=(p0[0]+p1[0])/2;d+=` C${mx},${p0[1]} ${mx},${p1[1]} ${p1[0]},${p1[1]}`;}
  const area=d+` L${pts[n-1][0]},${pT+ih} L${pts[0][0]},${pT+ih} Z`;
  const step=Math.ceil(n/5);let ticks='';
  for(let i=0;i<n;i+=step)ticks+=`<text class="axis" x="${pL+iw*(n>1?i/(n-1):.5)}" y="${h-3}" text-anchor="middle">${esc(labels[i])}</text>`;
  const yTicks=[min,max].map((v,k)=>`<text class="axis" x="${pL-3}" y="${k===0?pT+ih:pT+4}" text-anchor="end">${Math.round(v).toLocaleString()}</text>`).join('');
  const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--w)"><title>${series[i].toLocaleString()}</title></circle>`).join('');
  return`<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="max-height:${h}px">
    <defs><linearGradient id="gl${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(110,168,255,.32)"/><stop offset="100%" stop-color="rgba(110,168,255,0)"/></linearGradient></defs>
    <line x1="${pL}" y1="${pT+ih}" x2="${w-pR}" y2="${pT+ih}" stroke="var(--track)"/>
    <path d="${area}" fill="url(#gl${id})"/><path d="${d}" fill="none" stroke="var(--w)" stroke-width="1.8"/>
    ${dots}${ticks}${yTicks}</svg></div>`;
}
// Blast-radius rows. Bar length = dependents; the churn chip is the signal
// that separates "risky" from merely "load-bearing" — a 255-dependent node
// nobody has touched in 90 days is stable, a 222-dependent file edited 85
// times is where changes actually go wrong.
function hubBar(hubs){
  if(!hubs||!hubs.length)return'';
  const mx=Math.max(...hubs.map(h=>h.degree));
  return'<div style="display:flex;flex-direction:column;gap:7px;padding:2px 0">'+hubs.map(h=>{
    const pct=Math.round(h.degree/mx*100);
    const cls=h.churn>=40?'hot':h.churn>=10?'warm':'cold';
    const col=h.churn>=40?'var(--red)':h.churn>=10?'var(--amber)':'var(--w2)';
    const lbl=h.label.length>28?h.label.slice(0,26)+'…':h.label;
    const dir=h.file.includes('/')?h.file.slice(0,h.file.lastIndexOf('/')):'';
    return`<div class="cb-hub">
      <span class="cb-hub-name" title="${esc(h.file)}">${esc(lbl)}${dir?` <span class="cb-hub-file">${esc(dir)}/</span>`:''}</span>
      <div class="cb-hub-bar"><div class="cb-hub-fill" style="width:${pct}%;background:${col}"></div></div>
      <span class="cb-hub-deg num">${h.degree}</span>
      <span class="cb-hub-churn ${cls}">${h.churn} commits</span></div>`;
  }).join('')+'</div>';
}
// ── Strategy ──────────────────────────────────────────────────────────────
const SCAT_COLOR={blindspot:'var(--amber)',idea:'var(--w)',outlook:'var(--w2)',custom:'var(--green)',watchlist:'var(--p)'};
const SCAT_LABEL={blindspot:'Blind Spot',idea:'Idea',outlook:'Outlook',custom:'Custom',watchlist:'Watchlist'};
const SSTAT_COLOR={pending:'var(--dim)',approved:'var(--green)',researching:'var(--w)',denied:'var(--red)'};
const SPRI={p1:{c:'var(--red)',l:'P1'},p2:{c:'var(--amber)',l:'P2'},p3:{c:'var(--w)',l:'P3'}};
const SPRI_NEXT={p1:'p2',p2:'p3',p3:'','':'p1'};

function getStrategyItems(){
  const rd=(id,k)=>{try{return localStorage.getItem('strat.'+k+'.'+id);}catch(e){return null;}};
  const enrich=it=>({
    ...it,
    status:rd(it.id,'s')||it.status||'pending',
    priority:rd(it.id,'p')||it.priority||'',
    ip:!!rd(it.id,'ip'),          // handed off to Cowork → In Progress
    cmp:rd(it.id,'cmp')==='1',    // ledger Promoted=yes → Completed
    unc:rd(it.id,'unc')==='1'     // restored-from-completed override (forces Promoted=no next sync)
  });
  const base=(window.STRATEGY_DATA?.items||[]).map(enrich);
  let custom=[];
  try{custom=JSON.parse(localStorage.getItem('strat.custom')||'[]').map(enrich);}catch(e){}
  return [...base,...custom];
}
// Workflow lane for a card — drives rendering + counts.
function _scLane(it){
  if(it.status==='denied')return 'denied';
  if(it.cmp)return 'completed';
  if(it.ip)return 'inprogress';
  if(it.status==='approved'||it.status==='researching')return 'decided';
  return 'pending';
}

function stratAct(id,next){
  let cur='pending';try{cur=localStorage.getItem('strat.s.'+id)||'pending';}catch(e){}
  const ns=cur===next?'pending':next;
  try{
    localStorage.setItem('strat.s.'+id,ns);
    if(ns!=='pending')localStorage.setItem('strat.ts.'+id,new Date().toISOString());
    // A changed/fresh decision restarts the workflow: drop In-Progress + Completed state
    // so it must be re-handed-off via → Cowork. (Deny lands it in the Denied bucket.)
    localStorage.removeItem('strat.ip.'+id);
    localStorage.removeItem('strat.cmp.'+id);
    localStorage.removeItem('strat.unc.'+id);
  }catch(e){}
  show('strategy');
}

// ── Cowork ledger sync — browser-side merge, writes straight to 00_Strategy\Dashboard ──
// One click: read the existing ledger, merge this tab's decisions BY ID (preserving each
// row's Promoted flag + any rows already there), write it back. No JSON, no .bat, no node.
const _SC_COLS=['ID','Title','Category','Status','Priority','Decided','Promoted','Notes'];
const _SC_HEADER='| '+_SC_COLS.join(' | ')+' |';
const _SC_SEP='|'+_SC_COLS.map(()=>'---').join('|')+'|';
const _SC_LEDGER='strategy_decisions_ledger.md';
const _scCell=s=>String(s==null?'':s).replace(/\r?\n+/g,' ').replace(/\|/g,'\\|').replace(/\s+/g,' ').trim();
const _scPriDisp=p=>{p=(p||'').toLowerCase();return p?p.toUpperCase():'—';};
const _scSplit=line=>line.split(/(?<!\\)\|/).slice(1,-1).map(c=>c.trim());
const _scToday=()=>new Date().toISOString().slice(0,10);

function _scTemplate(tableBlock,updatedLine){
  return '<!-- BIMpossible strategy decisions ledger — durable record of decisions made on the\n'
    +'     dashboard Strategy tab, written directly (one click) by the "→ Cowork" button.\n'
    +'     Rows are appended/updated BY ID, never overwritten — history and the Promoted flag\n'
    +'     persist. Claude Cowork READS this as the source of truth. Promotion of approved items\n'
    +'     into BIMpossible_ProgramPlan_*.md is a SEPARATE, human-reviewed step. -->\n\n'
    +'# BIMpossible — Strategy Decisions Ledger\n\n'
    +updatedLine+'\n'
    +'**Source:** dashboard Strategy tab (one-click write), merged by ID (append/update, never overwrite).\n'
    +'One row per decision. **Promoted = yes** means the item has been marked ✓ Done (handled / folded into the ProgramPlan) via the dashboard and archived off the active board; Restore sets it back to no.\n\n'
    +'## Status legend\n'
    +'- `approved` — ratified; eligible for promotion into the ProgramPlan.\n'
    +'- `researching` — needs investigation before deciding.\n'
    +'- `denied` — rejected; kept for the audit trail, never promoted.\n\n'
    +'## Decisions\n\n'
    +tableBlock+'\n';
}

// Pure merge: existing ledger text + decided items → new full text + stats.
function _scMerge(existingText,decided){
  let existingRows=[];
  if(existingText){
    const lines=existingText.split(/\r?\n/);
    const s=lines.findIndex(l=>/^\|\s*ID\s*\|/i.test(l));
    if(s>=0)for(let i=s+2;i<lines.length&&/^\s*\|/.test(lines[i]);i++){const c=_scSplit(lines[i]);if(c.length>=7&&c[0])existingRows.push(c);}
  }
  const order=existingRows.map(r=>r[0]);
  const rowById=new Map(existingRows.map(r=>[r[0],r]));
  const today=_scToday();
  let added=0,updated=0,unchanged=0;
  decided.forEach(d=>{
    const prev=rowById.get(d.id);
    const dec=d.decided_at?String(d.decided_at).slice(0,10):(prev?prev[5]:today);
    const prevPromoted=prev?(prev[6]||'no'):'no';
    const promoted=d.unc?'no':prevPromoted;   // preserve the ledger's Promoted (set during the promotion pass); Restore forces it back to no
    const row=[d.id,_scCell(d.title),_scCell(d.cat),_scCell(d.status),_scPriDisp(d.priority),dec,promoted,_scCell(d.body)];
    if(!prev){added++;order.push(d.id);}
    else if(JSON.stringify(prev)===JSON.stringify(row)){unchanged++;}
    else{updated++;}
    rowById.set(d.id,row);
  });
  const rows=order.map(id=>rowById.get(id));
  const cnt={approved:0,researching:0,denied:0};
  rows.forEach(r=>{const st=(r[3]||'').toLowerCase();if(st in cnt)cnt[st]++;});
  const tableBlock=[_SC_HEADER,_SC_SEP,...rows.map(r=>'| '+r.join(' | ')+' |')].join('\n');
  const updatedLine='**Updated:** '+today+' ('+rows.length+' decisions: '+cnt.approved+' approved · '+cnt.researching+' research · '+cnt.denied+' denied)';
  let out;
  if(!existingText){out=_scTemplate(tableBlock,updatedLine);}
  else{
    const lines=existingText.split(/\r?\n/);
    const s=lines.findIndex(l=>/^\|\s*ID\s*\|/i.test(l));
    if(s>=0){let e=s+1;while(e+1<lines.length&&/^\s*\|/.test(lines[e+1]))e++;out=[...lines.slice(0,s),...tableBlock.split('\n'),...lines.slice(e+1)].join('\n');}
    else if(/^##\s+Decisions/m.test(existingText)){out=existingText.replace(/(^##\s+Decisions.*$)/m,'$1\n\n'+tableBlock);}
    else{out=existingText.replace(/\s*$/,'')+'\n\n## Decisions\n\n'+tableBlock+'\n';}
    if(/^\*\*Updated:\*\*.*$/m.test(out))out=out.replace(/^\*\*Updated:\*\*.*$/m,updatedLine);
    else out=out.replace(/^(#\s+.*$)/m,'$1\n\n'+updatedLine);
  }
  return {out,added,updated,unchanged,total:rows.length,cnt};
}

function _scCollect(){
  return getStrategyItems().filter(i=>i.status!=='pending').map(d=>({
    id:d.id,cat:d.cat,title:d.title,body:d.body||'',status:d.status,priority:d.priority||'',unc:!!d.unc,
    decided_at:(()=>{try{return localStorage.getItem('strat.ts.'+d.id)||null;}catch(e){return null;}})()
  }));
}
// Parse the Promoted column out of an existing ledger → { id: 'yes'|'no' }.
function _scPromotedMap(text){
  const m={};if(!text)return m;
  const lines=text.split(/\r?\n/);
  const s=lines.findIndex(l=>/^\|\s*ID\s*\|/i.test(l));
  if(s>=0)for(let i=s+2;i<lines.length&&/^\s*\|/.test(lines[i]);i++){const c=_scSplit(lines[i]);if(c.length>=7&&c[0])m[c[0]]=(c[6]||'').toLowerCase();}
  return m;
}

function stratExportDecisions(){
  const decided=_scCollect();
  if(!decided.length){_scFlash('Nothing decided yet — approve, research, or deny some items first');return;}
  if(!window.showDirectoryPicker){   // non-Chromium fallback: download JSON, merge via strategy_cowork_sync.mjs
    _scDownload(JSON.stringify({generated:new Date().toISOString(),decisions:decided},null,2));return;
  }
  (async()=>{
    let dir=await _scGetHandle();
    if(dir&&dir.kind!=='directory')dir=null;
    if(dir){let p=await dir.queryPermission({mode:'readwrite'}).catch(()=>'denied');if(p!=='granted')p=await dir.requestPermission({mode:'readwrite'}).catch(()=>'denied');if(p!=='granted')dir=null;}
    if(!dir){
      _scToast('One-time setup: pick the folder  00_Strategy \\ Dashboard  — the dashboard remembers it after this.');
      try{dir=await window.showDirectoryPicker({mode:'readwrite',id:'scledger'});}
      catch(e){if(e.name!=='AbortError')_scFlash('Folder pick cancelled');return;}
      await _scStoreHandle(dir);
    }
    try{
      const fh=await dir.getFileHandle(_SC_LEDGER,{create:true});
      let existing='';try{existing=await (await fh.getFile()).text();}catch(e){}
      const r=_scMerge(existing,decided);
      const w=await fh.createWritable();await w.write(r.out);await w.close();
      // ── Reconcile workflow lanes from the merged ledger ──
      // Triggering Cowork moves every decided item to In Progress; completion is read
      // back from the ledger's Promoted column (set during the promotion pass).
      const pm=_scPromotedMap(r.out);let comp=0;
      decided.forEach(d=>{try{
        if(d.status==='approved'||d.status==='researching'){
          if(!localStorage.getItem('strat.ip.'+d.id))localStorage.setItem('strat.ip.'+d.id,new Date().toISOString());
        }
        if(pm[d.id]==='yes'&&localStorage.getItem('strat.unc.'+d.id)!=='1'){localStorage.setItem('strat.cmp.'+d.id,'1');comp++;}
        else localStorage.removeItem('strat.cmp.'+d.id);

// ── Disclosure state ─────────────────────────────────────────────────────────────────────────
// Which sections are folded is a per-browser UI preference: local-only, never synced, never part
// of the dashboard's shared data. Strategy keeps its original `strat.secOpen` key so choices made
// before this change survive; Toolkit is new and takes the namespaced, versioned key, so a future
// schema change can bump `v2` instead of silently misreading old values.
const DISCLOSURE_KEY={strategy:'strat.secOpen',toolkit:'dashboard.v2.toolkit.secOpen',project:'dashboard.v2.project.phaseGroups'};
// Every read is defensive. A private window, a disabled or full store, a hand-edited value, or a
// stale schema must all resolve to "no preference" — which resolves to closed — rather than throw
// and blank the view. Only boolean entries are kept: a half-valid map is not partially trusted.
function readSecOpen(key){
  let raw=null;
  try{raw=localStorage.getItem(key);}catch(e){return {};}
  if(!raw)return {};
  let parsed=null;
  try{parsed=JSON.parse(raw);}catch(e){return {};}
  if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))return {};
  const out={};
  Object.keys(parsed).forEach(k=>{if(typeof parsed[k]==='boolean')out[k]=parsed[k];});
  return out;
}
function writeSecOpen(key,id,open){
  const st=readSecOpen(key);
  st[id]=!!open;
  // A write that can't land (quota, private mode) leaves the fold working for this render and
  // simply not remembered — the one thing it must not do is break the toggle.
  try{localStorage.setItem(key,JSON.stringify(st));}catch(e){}
  return st;
}
// Initial open state for one section, in strict precedence:
//   1. a valid stored preference for this exact section id,
//   2. this is the only section on screen — open it, or the filter's own result is invisible,
//   3. closed.
// Nothing opens a section merely for being first: a large category unfolding on every fresh visit
// is exactly what the disclosure work set out to remove.
function secInitialOpen(id,stored,soleSection){
  if(stored&&Object.prototype.hasOwnProperty.call(stored,id))return stored[id];
  return !!soleSection;
}
// Generic toggle for a section whose body is addressed by aria-controls and whose stable storage
// id is on data-sec. Keeps caret (driven off aria-expanded), aria-expanded, and `hidden` in step.
function secToggle(btn,key){
  const body=document.getElementById(btn.getAttribute('aria-controls'));if(!body)return;
  const open=body.hidden;
  body.hidden=!open;
  btn.setAttribute('aria-expanded',String(open));
  writeSecOpen(key,btn.dataset.sec,open);
}
function stratSecToggle(btn){secToggle(btn,DISCLOSURE_KEY.strategy);}

function strategyView(){
  const items=getStrategyItems();
  let catF='all',laneF='all',sortF='pri';
  try{
    catF=localStorage.getItem('strat.cat')||'all';
    laneF=localStorage.getItem('strat.status')||'all';

  }catch(e){}
  if(laneF==='approved'||laneF==='researching')laneF='decided';   // migrate old saved filters
  if(laneF==='archived')laneF='completed';

  // Assign every card to a workflow lane.
  const lane={};items.forEach(it=>lane[it.id]=_scLane(it));
  const byLane={pending:[],decided:[],inprogress:[],completed:[],denied:[]};
  items.forEach(it=>byLane[lane[it.id]].push(it));

  if(byLane.inprogress.length)cmdItems.push(`<span class="badge st-ok clickable" role="button" tabindex="0" title="${byLane.inprogress.length} item${byLane.inprogress.length!==1?'s':''} in progress — click to filter to In Progress" onclick="stratFilter('status','inprogress')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();stratFilter('status','inprogress');}">${byLane.inprogress.length} in progress</span>`);

  if(catCount.blindspot)cmdItems.push(`<span class="badge st-warn clickable" role="button" tabindex="0" title="${catCount.blindspot} blind spot${catCount.blindspot!==1?'s':''} — click to filter to Blind Spots" onclick="stratFilter('cat','blindspot')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();stratFilter('cat','blindspot');}">${catCount.blindspot} blind spot${catCount.blindspot!==1?'s':''}</span>`);
  if(!cmdItems.length){
    if(activeItems.length)cmdItems.push(`<span style="font-size:var(--ts-sm);color:var(--muted)">${activeItems.length} items — no priorities or decisions yet</span>`);
    else cmdItems.push(`<span style="font-size:var(--ts-sm);color:var(--status-ok)">Strategy clear — add ideas to track them here</span>`);
  }
  let h=`<div class="crumbs">Strategy</div><h2 class="page">Strategy &amp; Ideas</h2>`;
  h+=`<div class="ov-cmd ${cmdClass}">

  </div>`;

  // Quick Capture panel

  h+=`<div class="strat-capture">
    <div class="strat-cap-hdr" onclick="toggleCapture()">
      <span class="strat-cap-title">${ICO.boltI}Quick Capture
        ${dumps.length?`<span class="strat-cap-cnt">${dumps.length}</span>`:''}
        <span style="font-size:11px;color:var(--muted);font-weight:400">— dump ideas before they disappear</span>
      </span>
      <span style="color:var(--dim);font-size:var(--ts-base)">${capOpen?'▲':'▼'}</span>

  if(capOpen){
    h+=`<div class="strat-cap-body">
      <textarea class="strat-cap-ta" id="cap-ta" placeholder="Dump an idea, observation, question, or risk — hit Save or Ctrl+Enter. Promote to a card later." onkeydown="if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();saveDump();}"></textarea>

    if(dumps.length){
      h+=`<div class="cap-list">`;
      dumps.forEach(d=>{
        const ago=Math.floor((Date.now()-new Date(d.ts))/60000);

      });

    }
    h+=`</div>`;

  h+=`</div>`;

  // Category tabs
  const CATS=[['all','All'],['blindspot','Blind Spots'],['idea','Ideas'],['outlook','Outlook'],['watchlist','Watchlist'],['custom','Custom']];
  h+=`<div class="strat-tabs">`;
  CATS.forEach(([c,lbl])=>{

  });

  // Lane filter pills + sort + add
  h+=`<div class="strat-sr">`;
  [['all','All',activeItems.length],['pending','Pending',byLane.pending.length],['decided','Decided',byLane.decided.length],['inprogress','In Progress',byLane.inprogress.length],['completed','Completed',byLane.completed.length]].forEach(([k,lbl,n])=>{

  });

  // Add idea form

      <button class="sf-cancel" onclick="stratShowForm(false)">Cancel</button>
      <button class="sf-save" onclick="saveIdea()">Save Idea</button>
    </div>
  </div></div>`;

  // ── Grouped sections: active cards on top, minimized Completed stacked beneath, per group ──
  const showLane=k=>laneF==='all'||laneF===k;
  const cats=catF==='all'?['blindspot','idea','outlook','watchlist','custom']:[catF];
  const showComp=laneF==='all'||laneF==='completed';
  // Resolve which sections actually render BEFORE emitting any of them: the "only one section on
  // screen, so open it" rule has to count what survives the lane filter too, not just an explicit
  // category tab. A lane filter that leaves one populated category is the same situation.
  const rendered=cats.map(c=>({
    c,
    act:sortItems(activeItems.filter(i=>i.cat===c&&showLane(lane[i.id]))),
    comp:showComp?sortItems(byLane.completed.filter(i=>i.cat===c)):[]
  })).filter(g=>g.act.length||g.comp.length);
  const anySection=rendered.length>0;
  const secState=readSecOpen(DISCLOSURE_KEY.strategy);
  const sole=rendered.length===1;
  // A filter that leaves exactly one category MUST show its result: a stored "closed" for
  // that category would otherwise render the filtered page apparently empty. The forced
  // open is render-only — nothing is written, so clearing the filter returns to the stored
  // preference. Unfiltered renders keep the normal precedence (stored wins, then sole).
  const filtering=catF!=='all'||laneF!=='all';
  rendered.forEach(({c,act:actInCat,comp:compInCat})=>{

      });
      h+=`</div>`;
    }
    h+=`</div>`;
  }

  return h;
}
// Full active card (pending / decided / in-progress). Denied + completed render minimized.
function _stratCard(it,ln){

  return `<div class="strat-card${inProg?' inprogress':''}">
    <div class="strat-ct">
      <span class="strat-cat-lbl" style="color:${SCAT_COLOR[it.cat]||'var(--dim)'}">${SCAT_LABEL[it.cat]||it.cat}</span>

        ${inProg?`<span class="strat-ip-badge">⟳ In progress</span>`:''}
        <button class="strat-pri" onclick="stratPri('${safe}')" title="Cycle priority: P1→P2→P3→none" style="background:transparent;border:1px solid;border-radius:5px;padding:2px 7px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;letter-spacing:.05em;${priStyle}">${pri?SPRI[pri].l:'—'}</button>
        <span class="strat-stat-lbl" style="color:${SSTAT_COLOR[st]||'var(--dim)'}">${st}</span>
      </div>
    </div>

const CPAL=['#6ea8ff','#a78bfa','#34d399','#fbbf24','#f87171','#22d3ee','#fb923c','#a3e635','#f472b6','#60a5fa'];
function arcGauge(pct,size,color,big,sub){
  pct=Math.max(0,Math.min(100,pct));
  const sw=Math.max(8,Math.round(size*.085)),r=(size-sw)/2-1,c=2*Math.PI*r,arc=0.75;
  return`<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0">
    <svg width="${size}" height="${size}" style="transform:rotate(135deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c*arc} ${c}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c*arc*pct/100} ${c}"/>
    </svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div style="font-family:Sora;font-size:${Math.round(size*.26)}px;font-weight:700;color:var(--text);line-height:1">${big}</div>
      ${sub?`<div style="font-size:${Math.max(9,Math.round(size*.072))}px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.05em">${sub}</div>`:''}
    </div></div>`;
}
function ringChart(segs,size,big,sub){
  const sw=Math.max(10,Math.round(size*.15)),r=(size-sw)/2-1,c=2*Math.PI*r;
  const total=segs.reduce((s,x)=>s+x.value,0)||1;let off=0;
  const arcs=segs.map(x=>{const len=c*(x.value/total);const el=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${x.color}" stroke-width="${sw}" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}"><title>${esc(x.label)}</title></circle>`;off+=len;return el;}).join('');
  return`<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/>${arcs}</svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div style="font-family:Sora;font-size:${Math.round(size*.15)}px;font-weight:700;color:var(--text);line-height:1.1">${big}</div>

}
function legend(segs){

function sankeyFlow(w,totals){
  const types=(w.subagentTypes||[]).slice(0,7);
  if(!types.length)return '<p class="sub" style="margin:0">No subagent spawns in the scanned window.</p>';
  const W=820,padT=14,padB=14,gap=10,H=Math.max(220,types.length*54);
  const totalSpawn=types.reduce((a,b)=>a+b.count,0)||1;
  const usable=H-padT-padB-(types.length-1)*gap;
  let y=padT;const tN=types.map((t,i)=>{const hh=Math.max(20,usable*(t.count/totalSpawn));const o={...t,y,h:hh,color:CPAL[i%CPAL.length]};y+=hh+gap;return o;});
  const sX=24,sW=110,mX=210,mW=120,tX=400,tW=180,oX=684,oW=112,sMid=H/2,mMid=H/2;
  const completed=Math.round(totalSpawn*w.successRate/100),errored=Math.max(0,totalSpawn-completed);
  const cH=Math.max(26,(H-padT-padB-gap)*(completed/totalSpawn)),eH=Math.max(14,errored>0?(H-padT-padB-gap)*(errored/totalSpawn):0),cY=padT,eY=cY+cH+gap;
  const link=(x1,y1,x2,y2,wd,col,op)=>{const mx=(x1+x2)/2;return`<path d="M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="${Math.max(1,wd)}" stroke-opacity="${op}" stroke-linecap="round"/>`;};
  let links=link(sX+sW,sMid,mX,mMid,16,'#6ea8ff',.3);
  for(const t of tN){const cy=t.y+t.h/2,wd=Math.max(2,t.h*.5);links+=link(mX+mW,mMid,tX,cy,wd,t.color,.3);links+=link(tX+tW,cy,oX,cY+cH/2,Math.max(2,wd*w.successRate/100),'#34d399',.26);if(errored>0)links+=link(tX+tW,cy,oX,eY+eH/2,Math.max(1,wd*(1-w.successRate/100)),'#f87171',.3);}
  const node=(x,yy,ww,hh,fill,label,badge)=>`<rect x="${x}" y="${yy}" width="${ww}" height="${hh}" rx="7" fill="${fill}" fill-opacity="0.17" stroke="${fill}" stroke-opacity="0.6"/><text x="${x+10}" y="${yy+hh/2+1}" dominant-baseline="middle" font-size="12" fill="#e2e6f3" font-family="Inter">${esc(label)}</text>${badge!=null?`<text x="${x+ww-9}" y="${yy+hh/2+1}" text-anchor="end" dominant-baseline="middle" font-size="11" fill="#8491a8" font-family="Inter">${badge}</text>`:''}`;
  let nodes=node(sX,sMid-22,sW,44,'#6ea8ff','Sessions',totals.sessions)+node(mX,mMid-22,mW,44,'#a78bfa','Main agent',totalSpawn);
  for(const t of tN)nodes+=node(tX,t.y,tW,t.h,t.color,t.type.length>17?t.type.slice(0,16)+'…':t.type,t.count);
  nodes+=node(oX,cY,oW,cH,'#34d399','Completed',completed)+(errored>0?node(oX,eY,oW,eH,'#f87171','Error',errored):'');
  const head=[['ORIGIN',sX],['MAIN AGENT',mX],['SUBAGENT TYPES',tX],['OUTCOMES',oX]].map(([t,x])=>`<text x="${x}" y="9" font-size="9" fill="#4d5870" font-family="Inter" letter-spacing="1">${t}</text>`).join('');
  return`<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H+18}" width="100%" style="min-width:680px;display:block">${head}<g transform="translate(0,14)">${links}${nodes}</g></svg></div>`;
}
function heatGrid(days){
  if(!days||!days.length)return '';
  const max=Math.max(...days.map(d=>d.cost),1),byDate={};days.forEach(d=>byDate[d.date]=d.cost);
  const first=new Date(days[0].date+'T00:00:00Z'),last=new Date(days[days.length-1].date+'T00:00:00Z');
  const start=new Date(first);start.setUTCDate(start.getUTCDate()-start.getUTCDay());
  const cells=[];let cur=new Date(start);
  while(cur<=last){const ds=cur.toISOString().slice(0,10);cells.push({ds,v:byDate[ds]||0,col:Math.floor((cur-start)/6048e5),row:cur.getUTCDay()});cur.setUTCDate(cur.getUTCDate()+1);}
  const cols=Math.max(...cells.map(c=>c.col))+1,cell=14,gap=4,W=cols*(cell+gap),H=7*(cell+gap);
  const COL=['rgba(110,168,255,.06)','rgba(110,168,255,.3)','rgba(110,168,255,.52)','rgba(110,168,255,.74)','#6ea8ff'];
  const rects=cells.map(c=>{const lv=c.v===0?0:Math.min(4,Math.ceil(c.v/max*4));return`<rect x="${c.col*(cell+gap)}" y="${c.row*(cell+gap)}" width="${cell}" height="${cell}" rx="3" fill="${COL[lv]}"><title>${c.ds}: $${c.v.toFixed(2)}</title></rect>`;}).join('');
  return`<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="${Math.min(W,640)}" height="${H}" style="display:block">${rects}</svg></div>`;
}

function githubActionsBody(){

  const totalMin=rows.reduce((s,r)=>s+r.qty,0);
  const linuxMin=rows.filter(r=>r.sku==='actions_linux').reduce((s,r)=>s+r.qty,0);
  const winMin=rows.filter(r=>r.sku==='actions_windows').reduce((s,r)=>s+r.qty,0);
  const grossCost=rows.reduce((s,r)=>s+r.gross,0);
  const repos=new Set(rows.map(r=>r.repo)).size;
  let h='<p class="sub">GitHub Actions compute minutes across all repos — <b>net cost $0</b> (fully included in plan). Gross shows the pay-as-you-go equivalent.</p>';

  </div>`;
  const byDate={};rows.forEach(r=>{byDate[r.date]=(byDate[r.date]||0)+r.qty;});

    const hp=Math.max(3,Math.round(byDate[d]/mx*120)),spike=byDate[d]===mx;
    return`<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px">

      <div title="${d}: ${byDate[d]} min" style="width:64%;max-width:20px;height:${hp}px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,${spike?'var(--amber)':'var(--w)'},rgba(110,168,255,.22))"></div>
      <div style="font-size:var(--ts-xs);color:var(--dim);white-space:nowrap">${d.slice(5)}</div>
    </div>`;
  }).join('');
  h+=`<div class="card fade" style="animation-delay:.06s;margin-bottom:20px"><h3>Daily minutes — ${esc(G.period.start)} → ${esc(G.period.end)} <span style="color:var(--dim);font-weight:400;font-size:11px">(amber = peak)</span></h3>
    <div style="display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:8px">${bars}</div></div>`;
  const byRepo={};rows.forEach(r=>{byRepo[r.repo]=(byRepo[r.repo]||0)+r.qty;});
  const sRepos=Object.entries(byRepo).sort((a,b)=>b[1]-a[1]);
  const repoRows=sRepos.map(([repo,min],i)=>{
    const pct=Math.round(min/totalMin*100);
    return`<div style="display:flex;align-items:center;gap:10px;margin:7px 0">
      <div style="width:170px;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(repo)}">${esc(repo)}</div>
      <div style="flex:1;height:8px;background:rgba(110,168,255,.08);border-radius:4px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${CPAL[i%CPAL.length]}"></div></div>
      <div style="width:60px;text-align:right;font-size:12px;color:var(--text)" class="num">${min} min</div>
      <div style="width:36px;text-align:right;font-size:11px;color:var(--dim)" class="num">${pct}%</div>
    </div>`;
  }).join('');
  h+=`<div class="card fade" style="animation-delay:.09s;margin-bottom:20px"><h3>By repository</h3>${repoRows}</div>`;
  const byWf={};rows.forEach(r=>{byWf[r.wf]=(byWf[r.wf]||0)+r.qty;});
  const sWf=Object.entries(byWf).sort((a,b)=>b[1]-a[1]);
  const wfMx=Math.max(1,sWf[0]?.[1]||1);
  const wfRows=sWf.map(([wf,min])=>{
    const pct=Math.round(min/totalMin*100),bar=Math.round(min/wfMx*100);
    return`<div style="display:flex;align-items:center;gap:10px;margin:6px 0">
      <code style="width:185px;font-size:11px;color:var(--w);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(wf)}">${esc(wf)}</code>
      <div style="flex:1;height:6px;background:rgba(110,168,255,.08);border-radius:3px;overflow:hidden"><div style="width:${bar}%;height:100%;background:var(--w);opacity:.65"></div></div>
      <div style="width:60px;text-align:right;font-size:12px;color:var(--text)" class="num">${min} min</div>
      <div style="width:36px;text-align:right;font-size:11px;color:var(--dim)" class="num">${pct}%</div>
    </div>`;
  }).join('');
  h+=`<div class="card fade" style="animation-delay:.12s;margin-bottom:20px"><h3>By workflow</h3>${wfRows}</div>`;
  const humanMin=rows.filter(r=>r.user==='YourBIMpossible').reduce((s,r)=>s+r.qty,0);
  const botMin=totalMin-humanMin,hPct=Math.round(humanMin/totalMin*100);
  h+=`<div class="card fade" style="animation-delay:.15s;margin-bottom:20px"><h3>Trigger breakdown</h3>
    <div style="display:flex;gap:28px;flex-wrap:wrap;margin-bottom:10px">
      <div><div class="v num" style="font-size:20px">${humanMin}</div><div class="l">Human pushes (${hPct}%)</div></div>
      <div><div class="v num" style="font-size:20px;color:var(--dim)">${botMin}</div><div class="l">dependabot (${100-hPct}%)</div></div>
    </div>
    <div style="height:8px;border-radius:4px;overflow:hidden;background:rgba(110,168,255,.08)"><div style="width:${hPct}%;height:100%;background:var(--w)"></div></div>
  </div>`;
  if(G.liveBilling){
    const lb=G.liveBilling,planMin=lb.included_minutes||3000;
    const pctUsed=Math.min(100,Math.round(totalMin/planMin*100)),remaining=Math.max(0,planMin-totalMin);
    h+=`<div class="card fade" style="animation-delay:.18s;margin-bottom:20px"><h3>Plan usage <span style="color:var(--green);font-size:11px;font-weight:400">● live · ${esc(lb.computed_from||'')}</span></h3>
      <div class="stat-row" style="margin-top:8px">
        <div class="stat st-info"><div class="v num">${totalMin.toLocaleString()}</div><div class="l">Minutes used (export)</div></div>
        <div class="stat st-ok"><div class="v num">$0</div><div class="l">Overage cost</div></div>
        <div class="stat"><div class="v num">${remaining.toLocaleString()}</div><div class="l">Remaining of ${planMin.toLocaleString()}</div></div>
      </div>
      <div style="margin-top:10px">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px"><span>${pctUsed}% of monthly plan used</span><span>${totalMin} / ${planMin} min</span></div>
        <div style="height:8px;border-radius:4px;overflow:hidden;background:rgba(110,168,255,.08)"><div style="width:${pctUsed}%;height:100%;background:${pctUsed>90?'var(--amber)':'var(--green)'}"></div></div>
      </div>
      <p class="sub" style="margin-top:8px;font-size:11px">GitHub's API reports 0 paid ms — all usage is within the ${planMin.toLocaleString()} included plan minutes, nothing overages. Minutes total from CSV export · period: ${esc(lb.billing_period_start||G.period.start)} →</p>
    </div>`;
  }
  h+=`<p class="sub" style="margin-top:16px;font-size:11px;color:var(--dim)">Source: ${esc(G.source)} · refreshed ${new Date(G.generated).toLocaleString()}${freshTag(G.generated,FRESH.ci)}</p>`;
  return h;
}

const _caTok=n=>{n=+n||0;return n>=1e6?(n/1e6).toFixed(2)+'M':n>=1000?(n/1000).toFixed(1)+'K':String(Math.round(n));};
const _caResetLbl=iso=>{try{return new Date(iso+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});}catch(e){return iso;}};

      </div>

      ${tile('Credits',_caFmt(credits),'balance',low?'var(--amber)':'var(--green)')}

function mdToHtml(md){
  md=md.replace(/\r/g,'');
  const e=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Link hrefs are content-derived: quote-escape them and allow only http(s)/vscode/#/relative
  // targets, else `[x](" onclick=...)` or javascript: URLs become live attributes (found 2026-07-09).
  const inl=s=>e(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,t,u)=>{u=u.trim();return/^(https?:|vscode:|#|\.?\/)/i.test(u)?`<a href="${u.replace(/"/g,'&quot;')}" target="_blank" rel="noopener">${t}</a>`:`${t} (${u})`;});
  const lines=md.split('\n'),out=[];let i=0;
  while(i<lines.length){
    const ln=lines[i];
    if(/^```/.test(ln)){const c=[];i++;while(i<lines.length&&!/^```/.test(lines[i])){c.push(e(lines[i]));i++;}i++;out.push('<pre class="mdcode">'+c.join('\n')+'</pre>');continue;}
    const hm=ln.match(/^(#{1,6})\s+(.*)/);
    if(hm){out.push('<h'+hm[1].length+'>'+inl(hm[2])+'</h'+hm[1].length+'>');i++;continue;}
    if(/^\|/.test(ln)&&i+1<lines.length&&/^\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      const head=ln.split('|').slice(1,-1).map(c=>'<th>'+inl(c.trim())+'</th>').join('');i+=2;const rows=[];
      while(i<lines.length&&/^\|/.test(lines[i])){rows.push('<tr>'+lines[i].split('|').slice(1,-1).map(c=>'<td>'+inl(c.trim())+'</td>').join('')+'</tr>');i++;}
      out.push('<table class="mdtable"><thead><tr>'+head+'</tr></thead><tbody>'+rows.join('')+'</tbody></table>');continue;}
    if(/^\s*[-*]\s+/.test(ln)){const it=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){it.push('<li>'+inl(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>');i++;}out.push('<ul>'+it.join('')+'</ul>');continue;}
    if(/^(---+|\*\*\*+)\s*$/.test(ln)){out.push('<hr>');i++;continue;}
    if(/^\s*$/.test(ln)){i++;continue;}
    out.push('<p>'+inl(ln)+'</p>');i++;
  }
  return out.join('');
}
// Graphify pipeline health (Check-GraphifyHealth.ps1, daily). Reports whether the
// graphs the panels above are built from are actually fresh, deterministic, and
// built at the commit they claim. Update availability is NOTIFY-ONLY: the 0.9.x
// upgrade changed node-ID behavior, so upgrading is a supervised step, never
// automatic. Absent file (public deploy / never run) renders nothing.
function graphifyHealthPanel(){
  const G=window.GRAPHIFY_HEALTH;
  if(!G)return'';
  const al=G.alerts||[],tg=G.targets||[];
  const sevCls={error:'st-danger',warn:'st-warn',info:'st-info'};
  const dot=G.status==='error'?'danger':G.status==='warn'?'warn':'clear';
  let items=[];
  if(!al.length)items.push(`<span class="badge st-ok">✓ pipeline healthy</span>`);
  al.forEach(a=>items.push(`<span class="badge ${sevCls[a.severity]||'st-info'}" title="${esc(a.action||'')}">${esc(a.message)}</span>`));
  const verTxt=G.latest_version&&G.latest_version!==G.installed_version
    ?`graphify ${esc(G.installed_version)} → ${esc(G.latest_version)} available`
    :`graphify ${esc(G.installed_version||'?')}`;
  let h=`<div class="ov-group">Graph pipeline health</div>`;
  h+=`<div class="ov-cmd ${dot}" style="margin-bottom:10px">
    <div class="ov-cmd-dot"></div>
    <div class="ov-cmd-items">${items.join('')}</div>
    <span class="ov-cmd-meta">${verTxt}${G.checked_at?' · checked '+esc(G.checked_at.slice(0,10)):''}</span>
  </div>`;
  if(tg.length){
    h+=`<div class="card" style="margin-bottom:14px"><h3>Last refresh</h3><ul class="alist">`;
    tg.forEach(t=>{
      const bits=[];
      if(t.nodes!=null)bits.push(`${t.nodes.toLocaleString()} nodes`);
      if(t.edges!=null)bits.push(`${t.edges.toLocaleString()} edges`);
      if(t.communities!=null)bits.push(`${t.communities} communities`);
      if(t.node_drift_pct!=null)bits.push(`drift ${t.node_drift_pct}%`);
      const flag=!t.ok?`<span class="badge st-danger">failed</span>`
        :t.head_match===false?`<span class="badge st-warn">behind HEAD</span>`
        :`<span class="badge st-ok">at HEAD</span>`;
      h+=`<li>${esc(t.name)} ${flag} <span style="color:var(--dim)">${bits.join(' · ')}</span></li>`;
    });
    h+=`</ul><p class="sub" style="margin-top:8px">AST-only (<code>--code-only</code>), deterministic (<code>PYTHONHASHSEED=0</code>), weekly. Upgrades are never automatic.</p></div>`;
  }
  return h;
}

  const cb=(ni&&ni.codebase)||{};

  const hubs=cb.hubs||[];

  // ── Command bar ───────────────────────────────────────────────────────────
  // Only a measured regression against the frozen baseline turns this red.
  // Blast radius is a "watch" (amber), never a defect count — high fan-in is
  // often the design working, e.g. one auth gate covering every route.

    cmdItems.push(`<span class="badge ${hot?'st-warn':'st-info'} clickable" role="button" tabindex="0" title="${hubs.length} hub${hubs.length!==1?'s':''} tracked${hot?`, ${hot} edited heavily in the last 90d`:''} — click to jump to detail below" onclick="jumpFlash('#cb-sec-blast .card')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();jumpFlash('#cb-sec-blast .card');}">${hot?`${hot} hot hub${hot!==1?'s':''}`:`${hubs.length} hubs tracked`}</span>`);
  }
  if(cbGraph.stale)cmdItems.push(`<span class="badge st-warn" title="The knowledge graph was built at ${esc(cbGraph.commit||'?')} and HEAD has moved on. Run Update-Graph.ps1 to re-measure.">graph ${cbGraph.commitsBehind} commits behind</span>`);

  if(!cmdItems.length)cmdItems.push(`<span style="font-size:var(--ts-sm);color:var(--status-ok)">Architecture clean — no active risk signals</span>`);
  const totalStr=cbGraph.nodes?`${cbGraph.nodes.toLocaleString()} nodes`:(ni&&ni.stats&&ni.stats.totalNodes?`${ni.stats.totalNodes.toLocaleString()} nodes`:(L?`${L.nodes.toLocaleString()} nodes`:''));
  // Stamp the date the graph was BUILT, not the date this file was rendered —

  h+=`<div class="ov-cmd ${cmdClass}">

        </div>
      </div></div>`;
    });

  // ── Verified clean ────────────────────────────────────────────────────────

        <div class="cb-risk-num ok">${s.nodes!=null?s.nodes:'✓'}</div>
        <div class="cb-risk-body">
          <div class="cb-risk-title">${esc(s.label)}</div>
          <div class="cb-risk-finding">${esc(s.finding)}</div>
          <div class="cb-risk-meta"><span class="au-where">${esc(s.repo)}</span><span>${esc(s.tool)} · ${esc(s.algo)}</span>${cb.baseline?`<span>baseline ${cb.baseline.cycles} · set ${esc(cb.baseline.setAt)}</span>`:''}</div>
        </div>
      </div></div>`;
    });
    h+=`</div>`;
  }

  // ── High blast-radius nodes ───────────────────────────────────────────────
  if(hubs.length){
    const hot=hubs.filter(x=>x.churn>=40);
    h+=`<div class="ov-group">Blast radius — where changes ripple furthest</div><div id="cb-sec-blast">`;
    h+=`<div class="card ${hot.length?'ca-amber':'ca-blue'}" style="margin-bottom:10px">
      <div style="font-size:var(--ts-xs);color:var(--muted);margin-bottom:12px">Bar = modules that depend on this node. Red commit counts are the ones actually being edited — that combination is the risk, not fan-in alone.</div>
      ${hubBar(hubs)}
      <div class="cb-note">${hot.length
        ? `<strong>${esc(hot[0].file)}</strong> is the hotspot: ${hot[0].degree} dependents and ${hot[0].churn} commits in 90 days. Splitting it is the single highest-leverage refactor here.`
        : `Every hub is stable — widely depended on, but rarely edited. Nothing to act on.`}
        Test helpers and third-party imports are excluded; a fixture with 165 dependents inside one test file is not a production risk.</div>
    </div></div>`;
  }

  // ── Blind spots ───────────────────────────────────────────────────────────
  if(missingSurf.length){
    h+=`<div class="ov-group">Blind spots — not yet mapped</div><div id="cb-sec-blind">`;
    h+=`<div class="g g${Math.min(missingSurf.length,3)}" style="margin-bottom:10px">`;
    missingSurf.forEach(s=>{
      h+=`<div class="card ca-amber">
        <div class="cb-gap-name">${esc(s.label)}</div>
        <div class="cb-gap-sub">${esc(s.repo)}</div>
        <div class="cb-gap-why">Unmapped · run <code>${esc(s.tool)}</code> to wire in</div>
      </div>`;
    });
    h+=`</div></div>`;
  }

  // ── Mapped surfaces ───────────────────────────────────────────────────────
  if(mappedSurf.length){
    h+=`<div class="ov-group">Mapped surfaces</div>`;
    h+=`<div class="g g${Math.min(mappedSurf.length,3)}" style="margin-bottom:10px">`;
    mappedSurf.forEach(s=>{
      h+=`<div class="card ca-green">
        <div style="font-size:var(--ts-sm);font-weight:700;font-family:Sora;margin-bottom:4px">${esc(s.label)}</div>
        ${s.nodes!=null?`<div style="font-size:var(--ts-xl);font-weight:800;color:var(--status-ok);line-height:1.1;margin-bottom:4px">${s.nodes.toLocaleString()}</div>`:''}
        <div style="font-size:var(--ts-xs);color:var(--dim)">${esc(s.repo)}</div>
        ${s.finding?`<div style="font-size:var(--ts-xs);color:var(--muted);margin-top:5px;line-height:1.45">${esc(s.finding)}</div>`:''}
      </div>`;
    });
    h+=`</div>`;
  }

  // ── Architecture health ───────────────────────────────────────────────────
  if(L){
    h+=`<div class="ov-group">Architecture health</div>`;
    function cbDelta(cur,prev,lb){
      if(!P)return'';const d=cur-prev;if(!d)return'';
      const good=lb?d<0:d>0;
      return`<div style="margin-top:4px"><span style="font-size:11px;font-weight:600;color:${good?'var(--status-ok)':'var(--status-danger)'}">${d>0?'+':''}${d}</span></div>`;
    }
    // Cycle count comes from the live measurement, not the historical snapshot:
    // graph-metrics.js records graphify's capped top_n=20, so L.cycles was a
    // constant 20 in every push and rendered permanently red here too.
    const realCyc=(cb.cycles&&cb.cycles.count!=null)?cb.cycles.count:null;
    const cycSt=realCyc==null?'st-dim':realCyc>(cb.baseline?cb.baseline.cycles:0)?'st-danger':realCyc?'st-warn':'st-ok';
    const hasCharts=gm.length>1;
    const jumpAttr=(id,label)=>hasCharts?` role="button" tabindex="0" title="${esc(label)} — click to see the trend below" onclick="jumpFlash('#${id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();jumpFlash('#${id}');}"`:` title="${esc(label)}"`;
    h+=`<div class="g gmg" style="margin-bottom:10px">
      <div class="stat st-info${hasCharts?' jumpable':''}"${jumpAttr('cb-chart-nodes','Total modules in the graph')}><div class="v num">${L.nodes.toLocaleString()}</div><div class="l">Nodes</div>${cbDelta(L.nodes,P?P.nodes:0,false)}</div>
      <div class="stat st-info" title="Cross-module import edges — higher means denser coupling"><div class="v num">${L.edges.toLocaleString()}</div><div class="l">Edges</div>${cbDelta(L.edges,P?P.edges:0,false)}</div>
      <div class="stat st-info" title="Clusters detected by graph community detection — a rough proxy for how modular the codebase is"><div class="v num">${L.communities}</div><div class="l">Communities</div>${cbDelta(L.communities,P?P.communities:0,false)}</div>
      <div class="stat ${cycSt}" title="Real cycle count, third-party import artifacts excluded${cb.baseline?` — baseline ${cb.baseline.cycles}`:''}"><div class="v num">${realCyc==null?'—':realCyc}</div><div class="l">Import cycles</div></div>
    </div>`;
    if(hasCharts){
      h+=`<div class="g g2" style="margin-bottom:10px">
        <div class="card" id="cb-chart-nodes"><h3>Nodes over time</h3>${glChart(gm.map(m=>m.nodes),gm.map(m=>m.ts.slice(5,10)+' '+m.sha),360,120,'gn')}</div>
        <div class="card"><h3>Communities over time</h3>${glChart(gm.map(m=>m.communities),gm.map(m=>m.ts.slice(5,10)+' '+m.sha),360,120,'gc')}</div>
      </div>`;
    }
    // gm.length is chart POINTS, not pushes, since adjacent no-op pushes (a re-run,
    // a doc-only commit) collapse into one point (see Update-GraphMetricsFromLedger).
    // `pushes` on each point says how many raw pushes it represents; older entries
    // predate that field, so they fall back to 1 (they were never collapsed).
    const totalPushes=gm.reduce((s,m)=>s+(m.pushes||1),0);
    h+=`<p style="font-size:var(--ts-xs);color:var(--dim);margin:0 0 16px">Growth snapshot: ${esc(L.ts.slice(0,10))} · commit <code>${esc(L.sha)}</code> · ${totalPushes} push${totalPushes!==1?'es':''} tracked (${gm.length} distinct)</p>`;
  }

  // ── Tools ─────────────────────────────────────────────────────────────────
  h+=`<div class="ov-group">Tools</div>`;
  h+=`<div class="card" style="margin-bottom:10px">
    <div style="font-size:var(--ts-xs);color:var(--muted);margin-bottom:10px">Open when the summary above surfaces something worth investigating in depth.</div>
    <div class="links">
      <a class="path-chip" href="#" onclick="window._ctab='network';try{localStorage.setItem('dash.ctab','network')}catch(e){}show('graph');return false;">Interactive node graph</a>
      <a class="path-chip" href="#" onclick="window._ctab='dashboard';try{localStorage.setItem('dash.ctab','dashboard')}catch(e){}show('graph');return false;">Standalone dashboard</a>
      <a class="path-chip" href="#" onclick="window._ctab='report';try{localStorage.setItem('dash.ctab','report')}catch(e){}show('graph');return false;">Full graph report</a>
    </div>
  </div>`;
  return h;
}

// ── Roadmap (phase dependency DAG) ──────────────────────────────────────────
const PSTATC={CLOSED:'var(--green)',SHIPPED:'var(--green)',BUILT:'var(--w)',ACTIVE:'var(--w)',PARTIAL:'var(--w)','ON HOLD':'var(--amber)',CONDITIONAL:'var(--amber)',PLANNED:'var(--dim)',PENDING:'var(--dim)',PLACEHOLDER:'var(--dim)'};
function _pstatc(s){const k=(s||'').toUpperCase();for(const key in PSTATC){if(k.indexOf(key)===0)return PSTATC[key];}return 'var(--grey)';}
function _pchip(n){return `<span class="dag-chip" role="button" tabindex="0" title="P${esc(n.id)} ${esc(n.name)}${n.status?' — '+esc(n.status):''} · open BIMpossible for phase detail" onclick="show('bimpossible')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();show('bimpossible');}"><span class="dag-dot" style="background:${_pstatc(n.status)}"></span>P${esc(n.id)} ${esc(n.name)}</span>`;}
function roadmapView(){
  const G=window.PHASE_DAG;
  let h='<div class="crumbs">BIMpossible</div><h2 class="page">Roadmap — Phase Dependencies</h2>';
  if(!G||!G.nodes){return h+'<p class="sub">No phase DAG yet — run <code>python phase_dag.py</code> in F:\\AI-Dashboard\\Dashboard to generate it.</p>';}
  h+=`<p class="sub">Derived from the PHASE-STATUS ledger's “Gate / depends on” column — real dependencies, no guesses. Generated ${esc(G.generated||'—')}.</p>`;
  const cp=G.criticalPath||[];
  h+=`<div class="card fade"><h3>Critical path — longest dependency chain</h3>`;
  h+=cp.length?`<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">`+cp.map((n,i)=>(i?`<span style="color:var(--dim)">→</span>`:'')+_pchip(n)).join('')+`</div>`:`<p class="empty">No phase-to-phase dependencies in the ledger.</p>`;
  h+=`</div>`;
  const lp=G.lynchpins||[];
  if(lp.length){
    const mx=Math.max.apply(null,lp.map(l=>l.gatesCount));
    h+=`<div class="card fade" style="animation-delay:.05s;margin-top:13px"><h3>Lynchpins — gate the most downstream phases</h3><div style="display:flex;flex-direction:column;gap:7px;padding:2px 0">`
      +lp.map(l=>`<div style="display:flex;align-items:center;gap:9px"><span class="lp-chip" role="button" tabindex="0" title="P${esc(l.id)} ${esc(l.name)} — gates ${l.gatesCount} downstream phase${l.gatesCount!==1?'s':''} · open BIMpossible for phase detail" onclick="show('bimpossible')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();show('bimpossible');}" style="min-width:210px;font-size:12px;font-family:Sora;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block">P${esc(l.id)} ${esc(l.name)}</span><div style="flex:1;height:6px;border-radius:4px;background:var(--track);overflow:hidden"><div style="height:100%;width:${Math.round(l.gatesCount/mx*100)}%;background:linear-gradient(90deg,var(--w),var(--w2))"></div></div><span class="num" style="min-width:78px;font-size:11px;color:var(--dim);text-align:right">gates ${l.gatesCount}</span></div>`).join('')
      +`</div></div>`;
  }
  const gens=G.generations||[];
  if(gens.length){
    h+=`<div class="card fade" style="animation-delay:.08s;margin-top:13px"><h3>Build order — dependency-legal generations</h3><div style="display:flex;gap:10px;overflow-x:auto;padding:4px 0">`
      +gens.map((gen,i)=>`<div style="flex:0 0 auto;min-width:200px"><div style="font-size:11px;color:var(--dim);margin-bottom:6px;font-family:Sora">Generation ${i+1}</div><div style="display:flex;flex-direction:column;gap:6px">`+gen.map(_pchip).join('')+`</div></div>`).join('')
      +`</div></div>`;
  }
  const eg=G.externalGates||[];
  if(eg.length){
    h+=`<div class="card fade" style="animation-delay:.11s;margin-top:13px"><h3>External (non-phase) gates</h3><ul style="margin:0;padding-left:18px;font-size:var(--ts-sm);color:var(--muted)">`
      +eg.map(e=>`<li><b>P${esc(e.phase)}</b> — ${esc(e.gate)}</li>`).join('')
      +`</ul></div>`;
  }
  return h;
}

let tkCat='all';
function tkSetCat(btn,cat){tkCat=cat;document.querySelectorAll('.tk-chip').forEach(c=>c.classList.toggle('on',c===btn));tkApply();}
function tkApply(){
  const q=(document.getElementById('tkSearch').value||'').toLowerCase().trim();
  document.querySelectorAll('.tk-card').forEach(c=>{
    const okCat=tkCat==='all'||c.dataset.cat===tkCat;
    const okQ=!q||c.dataset.search.includes(q);
    c.classList.toggle('tk-hidden',!(okCat&&okQ));
  });
  const filtering=!!q||tkCat!=='all';
  const tkState=readSecOpen(DISCLOSURE_KEY.toolkit);
  document.querySelectorAll('.tk-section').forEach(s=>{
    const hit=[...s.querySelectorAll('.tk-card')].some(c=>!c.classList.contains('tk-hidden'));
    s.classList.toggle('tk-hidden',!hit);
    // While filtering, any section holding a match opens so results are never folded away — a
    // matching card inside a collapsed section would be a result you can't see. Clearing the
    // filter hands control back to the stored preference, else closed.
    const btn=s.querySelector('.tk-sec-toggle'),g=btn&&document.getElementById(btn.getAttribute('aria-controls'));
    if(!btn||!g)return;
    const open=filtering?hit:secInitialOpen(btn.dataset.sec,tkState,false);
    g.hidden=!open;
    btn.setAttribute('aria-expanded',String(open));
  });
  const any=[...document.querySelectorAll('.tk-card')].some(c=>!c.classList.contains('tk-hidden'));
  const e=document.getElementById('tkEmpty');if(e)e.classList.toggle('tk-hidden',any);
}
function tkCopy(btn,cmd){
  navigator.clipboard.writeText(cmd).catch(()=>{});
  btn.classList.add('done');const sp=btn.querySelector('span');if(!sp)return;const o=sp.textContent;sp.textContent='copied';
  setTimeout(()=>{sp.textContent=o;btn.classList.remove('done');},1300);
}
