<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graph Dashboard &mdash; BIMpossible Backend</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a1a;padding:24px}
h1{font-size:1rem;font-weight:600;color:#444;margin-bottom:4px}
.meta{font-size:.75rem;color:#999;margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.card{background:#fff;border-radius:8px;padding:16px;border:1px solid #e2e8f0}
.lbl{font-size:.65rem;color:#999;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.val{font-size:1.9rem;font-weight:700;line-height:1}
.delta{font-size:.72rem;color:#bbb;margin-top:5px}
.delta.pos{color:#22c55e}.delta.neg{color:#ef4444}
.charts{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.box{background:#fff;border-radius:8px;padding:16px;border:1px solid #e2e8f0}
.box-title{font-size:.75rem;font-weight:600;color:#555;margin-bottom:12px}
canvas{max-height:200px}
.no-data{font-size:.8rem;color:#ccc;text-align:center;padding:40px}
.cdn-warn{font-size:.7rem;color:#f59e0b;background:#fefce8;border:1px solid #fde68a;border-radius:6px;padding:8px 12px;margin-top:12px;display:none}
</style>
</head>
<body>
<h1>Backend Knowledge Graph &mdash; BIMpossible</h1>
<div class="meta">Last updated: 2026-09-13 17:07 &nbsp;&middot;&nbsp; Pushes tracked: <span id="n">-</span></div>
<div class="cards">
  <div class="card"><div class="lbl">Nodes</div><div class="val" id="vn">-</div><div class="delta" id="dn"></div></div>
  <div class="card"><div class="lbl">Edges</div><div class="val" id="ve">-</div><div class="delta" id="de"></div></div>
  <div class="card"><div class="lbl">Communities</div><div class="val" id="vc">-</div><div class="delta" id="dc"></div></div>
</div>
<!-- Import cycles and god nodes are deliberately absent: both were display caps
     (graphify truncates cycles at top_n=20, god nodes at a 10-row leaderboard),
     so they charted as flat lines rather than measurements. Real cycle counts and
     churn-weighted hubs live on the Mission Control Codebase tab, which computes
     them from graph.json via Dashboard\graph_signals.py. -->
<div class="charts">
  <div class="box"><div class="box-title">Nodes &amp; Edges over Time</div><canvas id="cGrowth"></canvas></div>
  <div class="box"><div class="box-title">Communities over Time</div><canvas id="cComm"></canvas></div>
</div>
<div class="cdn-warn" id="cdnWarn">Charts could not load (Chart.js CDN unreachable). Stat cards above work offline.</div>

  crossorigin="anonymous"
  onerror="document.getElementById('cdnWarn').style.display='block'"></script>

  if (!M || !M.length) {
    document.querySelectorAll('canvas').forEach(function(c) {
      var d = document.createElement('div'); d.className = 'no-data';
      d.textContent = 'No data yet - run a push to start tracking';
      var p = c.parentNode; p.removeChild(c); p.appendChild(d);
    });
    return;
  }
  var L = M[M.length-1], P = M.length > 1 ? M[M.length-2] : null;
  // M.length is chart POINTS, not pushes -- consecutive pushes that measured an
  // identical graph collapse into one point before this template is filled in
  // (see the collapse loop in the script body, right before New-GraphDashboard
  // is called). `pushes` on each point says how many raw rows it represents;
  // sum it for the count this label has always claimed to show.
  var totalPushes = M.reduce(function(s, m) { return s + (m.pushes || 1); }, 0);
  document.getElementById('n').textContent = totalPushes + (M.length !== totalPushes ? ' (' + M.length + ' shown)' : '');

  // Growth metrics only - every card here is higher-is-better, so there is no
  // lower-is-better case to branch on.
  function stat(vi, di, val, prev) {
    document.getElementById(vi).textContent = val.toLocaleString();
    var el = document.getElementById(di);
    if (!P) { el.textContent = 'first push'; return; }
    var d = val - prev;
    el.textContent = (d >= 0 ? '+' : '') + d;
    el.className = 'delta ' + (d === 0 ? '' : (d > 0 ? 'pos' : 'neg'));
  }
  stat('vn', 'dn', L.nodes,       P ? P.nodes       : 0);
  stat('ve', 'de', L.edges,       P ? P.edges       : 0);
  stat('vc', 'dc', L.communities, P ? P.communities : 0);

  if (typeof Chart === 'undefined') return;

  var labels  = M.map(function(m) { return m.ts.slice(5,10) + ' ' + m.sha; });
  var xOpts   = { ticks: { font: { size: 9 }, maxRotation: 45 } };
  var legOpts = { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } };

  new Chart(document.getElementById('cGrowth'), { type: 'line',
    data: { labels: labels, datasets: [
      { label: 'Nodes', data: M.map(function(m){ return m.nodes; }), borderColor:'#3b82f6', tension:.3, yAxisID:'y' },
      { label: 'Edges', data: M.map(function(m){ return m.edges; }), borderColor:'#f59e0b', tension:.3, yAxisID:'y1' }
